# Secrets Store CSI only creates db-secret while a pod mounts this SPC.
# This pod has no dependency on db-secret, so it breaks the startup cycle for
# application Deployments that consume db-secret through secretKeyRef.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-of-anthos-secret-sync
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bank-of-anthos-secret-sync
  template:
    metadata:
      labels:
        app: bank-of-anthos-secret-sync
    spec:
      serviceAccountName: bank-of-anthos
      containers:
        - name: secret-sync
          image: public.ecr.aws/docker/library/busybox:1.36.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              test -s /mnt/secrets/db-username
              test -s /mnt/secrets/db-password
              test -s /mnt/secrets/jwtRS256.key
              test -s /mnt/secrets/jwtRS256.key.pub
              exec sleep 2147483647
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: bank-of-anthos-secrets
