apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 0
  template:
    spec:
      containers:
        - name: frontend
          image: asia-northeast2-docker.pkg.dev/kdt4-1-506106/bank-of-anthos/boa-frontend:sha-b59835c502f7d84170976d5e1d07151331e4fc71
          env:
            - name: ENV_PLATFORM
              value: "gcp"
            - name: CLUSTER_NAME
              value: "boa-gke"
      volumes:
        - $patch: replace
        - name: secrets-store
          secret:
            secretName: bank-app-jwt
            items:
              - key: jwtRS256.key.pub
                path: jwtRS256.key.pub
