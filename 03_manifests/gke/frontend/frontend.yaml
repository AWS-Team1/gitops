apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: frontend
          image: asia-northeast2-docker.pkg.dev/kdt4-1-506106/bank-of-anthos/boa-frontend:sha-b5bf59f052f5bc7c20d910992259957523999065
          env:
            - name: ENV_PLATFORM
              value: "gcp"
            - name: CLUSTER_NAME
              value: "boa-gke"
            - name: VALKEY_HOST
              valueFrom: {secretKeyRef: {name: valkey-secret, key: host}}
            - name: VALKEY_PORT
              value: "6379"
            - name: VALKEY_TLS
              value: "false"
            - name: VALKEY_CLUSTER_MODE
              value: "true"
      volumes:
        - $patch: replace
        - name: secrets-store
          secret:
            secretName: bank-app-jwt
            items:
              - key: jwtRS256.key.pub
                path: jwtRS256.key.pub
