apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bank-of-anthos
resources:
  - ../../base/frontend
  - ingress.yaml
patches:
  - path: frontend.yaml
  - path: service.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: frontend-networkpolicy
    patch: |-
      - op: replace
        path: /spec/ingress/0/from
        value:
          - ipBlock:
              cidr: 0.0.0.0/0
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: frontend-networkpolicy
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock:
                cidr: 10.10.48.0/29
          ports:
            - port: 6379
              protocol: TCP
