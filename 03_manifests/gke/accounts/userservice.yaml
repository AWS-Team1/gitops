apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
spec:
  replicas: 0
  template:
    spec:
      containers:
        - name: userservice
          image: asia-northeast2-docker.pkg.dev/kdt4-1-506106/bank-of-anthos/boa-userservice:sha-8c627b15d0b6481879a560a7bfddf265d148420c
          env:
            - name: REDIS_URL
              value: ""
            - name: POSTGRES_USER
              value: "accounts_app"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: accounts-db-secret
                  key: password
            - name: ACCOUNTS_DB_URI
              value: "postgresql+psycopg2://$(POSTGRES_USER)@10.50.1.5:5432/accountsdb"
      volumes:
        - $patch: replace
        - name: secrets-store
          secret:
            secretName: bank-app-jwt
            items:
              - key: jwtRS256.key
                path: jwtRS256.key
              - key: jwtRS256.key.pub
                path: jwtRS256.key.pub
