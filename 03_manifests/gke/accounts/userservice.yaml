apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: userservice
          image: asia-northeast2-docker.pkg.dev/kdt4-1-506106/bank-of-anthos/boa-userservice:sha-1343dad73d81dac8a5764f95a377086526efc043
          env:
            - name: VALKEY_HOST
              valueFrom: {secretKeyRef: {name: valkey-secret, key: host}}
            - name: VALKEY_PORT
              value: "6379"
            - name: VALKEY_TLS
              value: "false"
            - name: VALKEY_CLUSTER_MODE
              value: "true"
            - name: POSTGRES_USER
              value: "accounts_app"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: accounts-db-secret
                  key: password
            - name: ACCOUNTS_DB_URI
              value: "postgresql+psycopg2://$(POSTGRES_USER)@10.50.1.5:5432/accountsdb"
      volumes:
        - $patch: replace
        - name: secrets-store
          secret:
            secretName: bank-app-jwt
            items:
              - key: jwtRS256.key
                path: jwtRS256.key
              - key: jwtRS256.key.pub
                path: jwtRS256.key.pub
