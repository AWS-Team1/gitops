apiVersion: apps/v1
kind: Deployment
metadata:
  name: contacts
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: contacts
          image: asia-northeast2-docker.pkg.dev/kdt4-1-506106/bank-of-anthos/boa-contacts:sha-1343dad73d81dac8a5764f95a377086526efc043
          env:
            - name: POSTGRES_USER
              value: "accounts_app"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: accounts-db-secret
                  key: password
            - name: ACCOUNTS_DB_URI
              value: "postgresql+psycopg2://$(POSTGRES_USER)@10.50.1.5:5432/accountsdb"
      volumes:
        - $patch: replace
        - name: secrets-store
          secret:
            secretName: bank-app-jwt
            items:
              - key: jwtRS256.key.pub
                path: jwtRS256.key.pub
