apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boa-shared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: boa
  # HARD-CODED: 재사용할 GitHub 조직/저장소/브랜치에 맞게 변경한다.
  source:
    repoURL: https://github.com/AWS-Team1/gitops.git
    targetRevision: dev-0922
    path: 03_manifests/gke/shared
  destination:
    server: https://kubernetes.default.svc
    namespace: bank-of-anthos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
