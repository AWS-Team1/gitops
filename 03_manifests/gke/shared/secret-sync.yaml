apiVersion: v1
kind: ServiceAccount
metadata:
  name: bank-app-secret-sync
  namespace: bank-of-anthos
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bank-of-anthos-db-secrets
  namespace: bank-of-anthos
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/kdt4-1-506106/secrets/boa-database-accounts/versions/latest"
        path: "accounts-password"
      - resourceName: "projects/kdt4-1-506106/secrets/boa-database-ledger/versions/latest"
        path: "ledger-password"
      - resourceName: "projects/kdt4-1-506106/secrets/boa-jwt-private/versions/latest"
        path: "jwt-private"
      - resourceName: "projects/kdt4-1-506106/secrets/boa-jwt-public/versions/latest"
        path: "jwt-public"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: accounts-db-secret
  namespace: bank-of-anthos
spec:
  serviceAccountName: bank-app-secret-sync
  secretProviderClassName: bank-of-anthos-db-secrets
  secretObject:
    type: Opaque
    data:
      - sourcePath: "accounts-password"
        targetKey: "password"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: ledger-db-secret
  namespace: bank-of-anthos
spec:
  serviceAccountName: bank-app-secret-sync
  secretProviderClassName: bank-of-anthos-db-secrets
  secretObject:
    type: Opaque
    data:
      - sourcePath: "ledger-password"
        targetKey: "password"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: bank-app-jwt
  namespace: bank-of-anthos
spec:
  serviceAccountName: bank-app-secret-sync
  secretProviderClassName: bank-of-anthos-db-secrets
  secretObject:
    type: Opaque
    data:
      - sourcePath: "jwt-private"
        targetKey: "jwtRS256.key"
      - sourcePath: "jwt-public"
        targetKey: "jwtRS256.key.pub"
