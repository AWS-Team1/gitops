# ============================================================
# HorizontalPodAutoscaler (HPA) — 6개 서비스 전부에 대한 자동 확장 규칙
# 역할: 각 서비스의 CPU 사용률이 높아지면 Pod 개수를 자동으로 늘리고,
#       낮아지면 다시 줄여주는 "자동 조절 장치". 서비스마다 하나씩, 총 6개 블록.
#       "---" 로 여러 개의 리소스를 한 파일에 나열한 것.
# (metrics-server 설치됨 — TARGETS 에 실제 %가 나와야 정상. minReplicas 2는 가용성 확보용(노드 1대 죽어도 서비스 유지),
#  maxReplicas는 노드 2대 + anti-affinity 기준 목표치. 추가 용량은 GKE 노드 풀 autoscaling이 담당)
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

