---
# Source: bank-of-anthos/templates/secretproviderclass.yaml
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bank-of-anthos-secrets
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "rds!db-bd4826f3-1148-401c-92a7-30dd63c50d05"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: db-username
          - path: password
            objectAlias: db-password
      - objectName: "/boa/jwt/public"
        objectType: "secretsmanager"
        objectAlias: jwtRS256.key.pub
      - objectName: "/boa/jwt/private"
        objectType: "secretsmanager"
        objectAlias: jwtRS256.key
  secretObjects:
    - secretName: db-secret
      type: Opaque
      data:
        - objectName: db-username
          key: username
        - objectName: db-password
          key: password

