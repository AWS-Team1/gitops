---
# Source: bank-of-anthos/templates/userservice/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
    spec:
      serviceAccountName: bank-of-anthos
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: userservice
              topologyKey: kubernetes.io/hostname
      containers:
        - name: userservice
          image: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/boa-userservice:sha-ce6d9485b1c4c352bb6a033c8fb531f784545cd9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: VERSION
              value: "1.0"
            - name: PORT
              value: "8080"
            - name: ENABLE_TRACING
              value: "false"
            - name: LOG_LEVEL
              value: "info"
            - name: TOKEN_EXPIRY_SECONDS
              value: "3600"
            - name: PRIV_KEY_PATH
              value: /tmp/.ssh/jwtRS256.key
            - name: PUB_KEY_PATH
              value: /tmp/.ssh/jwtRS256.key.pub
            # DB (stable private DNS / boadb). username·password 는 CSI 로 동기화된 db-secret.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: ACCOUNTS_DB_URI
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db.boa.internal:5432/boadb"
          volumeMounts:
            - name: secrets-store
              mountPath: /tmp/.ssh
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: bank-of-anthos-secrets

