---
# 애플리케이션 Pod 전용 SecretProviderClass.
# 최소 권한 DB 자격 증명(/boa/database/app, role: bank_app)과 JWT 키만 참조한다.
# RDS master secret 은 여기 없으며, 앱 IAM Role 도 접근 권한이 없다.
# objectName 은 같은 계정·리전이면 secret 이름만으로 참조 가능하므로 ARN 이 필요 없다.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bank-of-anthos-secrets
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "/boa/database/app"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: db-username
          - path: password
            objectAlias: db-password
      - objectName: "/boa/jwt/public"
        objectType: "secretsmanager"
        objectAlias: jwtRS256.key.pub
      - objectName: "/boa/jwt/private"
        objectType: "secretsmanager"
        objectAlias: jwtRS256.key
  secretObjects:
    - secretName: db-secret
      type: Opaque
      data:
        - objectName: db-username
          key: username
        - objectName: db-password
          key: password

