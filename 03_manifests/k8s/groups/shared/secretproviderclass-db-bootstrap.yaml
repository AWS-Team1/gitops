---
# db-bootstrap Job 전용 SecretProviderClass. RDS master secret 을 참조하는 유일한 리소스.
# secretObjects 가 없으므로 Kubernetes Secret 으로 동기화되지 않고 Job Pod 안에 파일로만 마운트된다.
# secret VALUE 는 읽거나 출력·저장하지 않는다. master secret 이름은 boa-postgres 의 관리형 secret 이다.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bank-of-anthos-db-bootstrap-secrets
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "arn:aws:secretsmanager:ap-northeast-2:769413326616:secret:rds!db-e0fce020-bc9f-4ab0-9dee-f6424151bed3-SGbDVj"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: master-username
          - path: password
            objectAlias: master-password
      - objectName: "/boa/database/app"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: app-username
          - path: password
            objectAlias: app-password
