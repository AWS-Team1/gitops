apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bank-of-anthos
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - secretproviderclass.yaml
  - secretproviderclass-db-bootstrap.yaml
  - env-configmap.yaml
  - networkpolicy-default-deny.yaml
  - db-bootstrap/networkpolicy.yaml
  - db-bootstrap/job.yaml

# db-bootstrap Job 이 마운트하는 스키마 SQL. 같은 kustomization 안이라
# Job 의 volume.configMap.name 참조가 해시 이름으로 자동 치환된다.
configMapGenerator:
  - name: db-bootstrap-sql
    files:
      - db-bootstrap/sql/0-accounts-schema.sql
      - db-bootstrap/sql/0_init_tables.sql

# 생성된 ConfigMap 을 Job(wave -2)보다 먼저(wave -3) sync 하게 한다.
# annotation 은 name 해시에 들어가지 않으므로 Job 의 참조 이름은 그대로다.
patches:
  - target:
      kind: ConfigMap
      name: db-bootstrap-sql
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: db-bootstrap-sql
        annotations:
          argocd.argoproj.io/sync-wave: "-3"
