---
# Source: bank-of-anthos/templates/ledgerwriter/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerwriter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledgerwriter
  template:
    metadata:
      labels:
        app: ledgerwriter
    spec:
      serviceAccountName: bank-of-anthos
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: ledgerwriter
              topologyKey: kubernetes.io/hostname
      containers:
        - name: ledgerwriter
          image: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/boa-ledgerwriter:sha-ce6d9485b1c4c352bb6a033c8fb531f784545cd9
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: VERSION
              value: "1.0"
            - name: PORT
              value: "8080"
            - name: ENABLE_TRACING
              value: "false"
            - name: LOCAL_ROUTING_NUM
              value: "883745000"
            - name: PUB_KEY_PATH
              value: /tmp/.ssh/jwtRS256.key.pub
            - name: BALANCES_API_ADDR
              value: "balancereader:8080"
            # DB (stable private DNS / boadb)
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://db.boa.internal:5432/boadb"
            - name: SPRING_DATASOURCE_USERNAME
              value: "$(POSTGRES_USER)"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "$(POSTGRES_PASSWORD)"
          volumeMounts:
            - name: secrets-store
              mountPath: /tmp/.ssh
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: bank-of-anthos-secrets

