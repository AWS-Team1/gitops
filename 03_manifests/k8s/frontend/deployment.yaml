---
# Source: bank-of-anthos/templates/frontend/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: bank-of-anthos
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: frontend
              topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          image: public.ecr.aws/w7s8o2h9/bank-app/frontend:20260903-0ca63b4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: VERSION
              value: "1.0"
            - name: PORT
              value: "8080"
            - name: ENABLE_TRACING
              value: "false"
            - name: SCHEME
              value: "http"
            - name: LOG_LEVEL
              value: "info"
            - name: LOCAL_ROUTING_NUM
              value: "883745000"
            - name: PUB_KEY_PATH
              value: /tmp/.ssh/jwtRS256.key.pub
            - name: USERSERVICE_API_ADDR
              value: "userservice:8080"
            - name: CONTACTS_API_ADDR
              value: "contacts:8080"
            - name: BALANCES_API_ADDR
              value: "balancereader:8080"
            - name: HISTORY_API_ADDR
              value: "transactionhistory:8080"
            - name: TRANSACTIONS_API_ADDR
              value: "ledgerwriter:8080"
          volumeMounts:
            - name: secrets-store
              mountPath: /tmp/.ssh
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 300m
              memory: 384Mi
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: bank-of-anthos-secrets

