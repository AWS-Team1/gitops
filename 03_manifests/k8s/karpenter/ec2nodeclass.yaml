apiVersion: karpenter.k8s.aws/v1         # Karpenter AWS 전용 API 그룹
kind: EC2NodeClass                        # EC2 노드의 하드웨어/네트워크 설정 정의
metadata:
  name: default                           # nodepool.yaml의 nodeClassRef.name과 반드시 일치해야 함
spec:
  amiSelectorTerms:
    - alias: al2023@latest                # Amazon Linux 2023 최신 버전 자동 선택 (보안 패치 포함)
  role: boa-eks-node-role                 # Terraform이 생성하고 Karpenter 컨트롤러가 PassRole 할 수 있는 노드 역할
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: boa-eks    # aws-modules/network의 private subnet 태그와 일치
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: boa-eks    # EKS 클러스터 보안 그룹 태그와 일치
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi                  # 기본 20Gi → 50Gi (이미지, 로그 누적 고려)
        volumeType: gp3                   # gp2보다 성능 좋고 20% 저렴
        encrypted: true                   # EBS 볼륨 암호화 (은행 앱 필수 - 디스크 탈취 시 데이터 보호)
  tags:
    project: boa                          # Karpenter가 생성한 EC2에 붙는 태그 (비용 추적, 리소스 식별용)
