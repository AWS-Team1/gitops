apiVersion: karpenter.sh/v1              # Karpenter API 그룹
kind: NodePool                           # Karpenter가 관리할 노드 풀 정의
metadata:
  name: default
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default                    # ec2nodeclass.yaml의 name과 반드시 일치해야 함
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]          # 온디맨드만 허용 (spot은 회수 위험 → 은행 앱 부적합)
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]             # x86 아키텍처 고정 (기존 노드와 동일)
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium",          # 기존 노드와 동일한 타입
                   "t3.large"]           # HPA로 Pod 증가 시 Karpenter가 선택 가능한 더 큰 타입
  limits:
    cpu: 8                               # Karpenter가 추가 생성 가능한 최대 CPU (기존 노드 2대 포함 X)
    memory: 16Gi                         # Karpenter가 추가 생성 가능한 최대 메모리
  disruption:
    consolidationPolicy: WhenEmpty       # Pod가 완전히 없을 때만 노드 제거 (은행 앱 안정성 우선)
    consolidateAfter: 10m                # 조건 충족 후 10분 뒤 노드 제거 실행
