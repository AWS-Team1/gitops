apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerwriter
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: ledgerwriter
          image: asia-northeast2-docker.pkg.dev/kdt4-1-506106/bank-of-anthos/boa-ledgerwriter:sha-9041c08af810c6d9272ff94447b3f6e8f4ee28fe
          env:
            - name: POSTGRES_USER
              value: "ledger_app"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ledger-db-secret
                  key: password
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://10.50.1.11:5432/ledgerdb?sslmode=require"
            - name: SPRING_DATASOURCE_USERNAME
              value: "$(POSTGRES_USER)"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "$(POSTGRES_PASSWORD)"
      volumes:
        - $patch: replace
        - name: secrets-store
          secret:
            secretName: bank-app-jwt
            items:
              - key: jwtRS256.key.pub
                path: jwtRS256.key.pub
