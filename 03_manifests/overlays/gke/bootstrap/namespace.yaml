# =========================================================
# whatap-monitoring 네임스페이스 — GKE
#
# EKS 판(overlays/eks/bootstrap/namespace.yaml)과 만드는 이유는 같다 —
# 이 네임스페이스에 들어갈 SecretSync(같은 디렉터리)가 네임스페이스보다
# 먼저 적용되면 실패한다. boa-whatap-operator Application의
# CreateNamespace=true는 wave -15라 그보다 늦다.
#
# EKS 판과 다른 점 — PSA(파드 보안 어드미션) 라벨을 안 붙인다. GKE 쪽은
# 이 저장소에서 아직 다른 네임스페이스(shared/namespace.yaml의
# bank-of-anthos)도 PSA 라벨을 쓰지 않는다. 붙이려면 node-agent가
# hostPath를 쓰는지부터 EKS와 같은 방식으로 확인이 필요하다(미결).
# =========================================================
apiVersion: v1
kind: Namespace
metadata:
  name: whatap-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    kubernetes.io/metadata.name: whatap-monitoring
    app.kubernetes.io/part-of: observability
