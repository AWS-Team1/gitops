# =========================================================
# whatap-credentials — 쿠버네티스 제품(K8s 에이전트) 시크릿 자동화
#
# 이전에는 이 시크릿을 사람이 kubectl create secret으로 직접 만들었다
# (whatap-agent.yaml 머리말 참조 — 그 설명은 이제 이 파일로 대체된다).
# GCP 쪽 Workload Identity 바인딩(Infra/gcp-observability)이 이
# 네임스페이스용으로 생기면서, monitoring 네임스페이스(observability/
# secrets.yaml)와 같은 방식으로 자동화할 수 있게 됐다.
#
# ---------------------------------------------------------
# monitoring 네임스페이스의 SecretSync를 재사용하지 못하는 이유
# ---------------------------------------------------------
# 1. 쿠버네티스 Secret은 네임스페이스를 넘지 못한다. observability/
#    secrets.yaml이 만드는 whatap-observability Secret은 monitoring에
#    있고, 이 에이전트(whatap-operator)는 whatap-monitoring에 있다.
# 2. GCP Workload Identity 바인딩은 (네임스페이스, KSA 이름) 조합으로
#    principal이 정해진다. monitoring의 SA로는 이 네임스페이스에서
#    자격증명이 안 잡힌다. 그래서 이 네임스페이스 전용 SA가 필요하다.
#
# ---------------------------------------------------------
# 시크릿 이름 · 키 이름을 바꿀 수 없다
# ---------------------------------------------------------
# whatap-operator 차트(templates/secret-whatap-credentials.yaml:6)에
# 고정되어 있다 — Secret 이름은 whatap-credentials, 키는 WHATAP_LICENSE ·
# WHATAP_HOST · WHATAP_PORT. target.data의 sourcePath/targetKey를 그
# 이름 그대로 맞춘다.
#
# ---------------------------------------------------------
# 이 시크릿을 읽는 것 — whatap-operator Deployment
# ---------------------------------------------------------
# secretKeyRef로 직접 읽고 optional이 아니므로, 없으면 파드가 기동조차
# 못 한다. 그래서 이 SecretSync는 boa-whatap-operator Application
# (wave -15)보다 먼저 와야 한다 — 이 디렉터리를 담은 Application이
# wave -22인 이유다.
#
# ---------------------------------------------------------
# Secret Manager에 아래 세 시크릿이 있어야 한다 — 인프라 담당이 콘솔에서
# 직접 채운다(Terraform 미관리, AWS의 /boa/observability/*와 같은 원칙)
# ---------------------------------------------------------
#   boa-whatap-kubernetes-license   와탭 쿠버네티스 제품 액세스 키
#   boa-whatap-host                 수집 서버 호스트 (monitoring과 공유)
#   boa-whatap-port                 수집 서버 포트 (monitoring과 공유, 6600)
# =========================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: whatap-credentials-sync
  namespace: whatap-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: whatap-credentials
  namespace: whatap-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/kdt4-1-506106/secrets/boa-whatap-kubernetes-license/versions/latest"
        path: "kubernetes-license"
      - resourceName: "projects/kdt4-1-506106/secrets/boa-whatap-host/versions/latest"
        path: "whatap-host"
      - resourceName: "projects/kdt4-1-506106/secrets/boa-whatap-port/versions/latest"
        path: "whatap-port"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: whatap-credentials
  namespace: whatap-monitoring
  annotations:
    # whatap-operator(별도 Application, wave -15)보다 먼저.
    argocd.argoproj.io/sync-wave: "2"
spec:
  serviceAccountName: whatap-credentials-sync
  secretProviderClassName: whatap-credentials
  secretObject:
    type: Opaque
    data:
      - sourcePath: "kubernetes-license"
        targetKey: "WHATAP_LICENSE"
      - sourcePath: "whatap-host"
        targetKey: "WHATAP_HOST"
      - sourcePath: "whatap-port"
        targetKey: "WHATAP_PORT"
