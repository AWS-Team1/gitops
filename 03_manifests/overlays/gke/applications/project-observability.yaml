# =========================================================
# 관측 전용 AppProject — GKE
#
# EKS 판(overlays/eks/applications/project-observability.yaml)과 같은 이유로
# 나눈다. 자세한 배경은 그쪽 주석 참조.
#
# EKS 와 다른 점 둘
#   1. External Secrets Operator 가 없다. GKE 는 SecretSync 컨트롤러를 쓰고
#      그건 GKE 부가기능이라 우리가 Application 으로 설치하지 않는다.
#      → external-secrets 네임스페이스와 ClusterSecretStore 가 빠진다.
#   2. boa-whatap-bootstrap 이 없다. whatap-credentials 를 GKE 에서는 아직
#      사람이 만든다(미결 — GCP Secret Manager 에 값 자체가 없다).
# =========================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: boa-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-30"
spec:
  sourceRepos:
    - https://github.com/AWS-Team1/gitops.git
    - https://charts.jetstack.io
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://whatap.github.io/helm

  destinations:
    # 수집기 · SecretSync · SecretProviderClass
    - server: https://kubernetes.default.svc
      namespace: monitoring

    - server: https://kubernetes.default.svc
      namespace: whatap-monitoring

    - server: https://kubernetes.default.svc
      namespace: cert-manager

    - server: https://kubernetes.default.svc
      namespace: opentelemetry-operator-system

    # cert-manager 차트가 리더 선출용 Role·RoleBinding 을 여기 만든다.
    # 차트 기본값이라 우리가 끄지 않는 한 따라온다.
    - server: https://kubernetes.default.svc
      namespace: kube-system

    # Instrumentation/boa 가 앱 네임스페이스에 있다. EKS 판 주석 참조.
    - server: https://kubernetes.default.svc
      namespace: bank-of-anthos

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

    - group: rbac.authorization.k8s.io
      kind: ClusterRole

    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration

    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration

    # 렌더로 확인 — GKE 관측 오버레이도 WhatapAgent 를 만든다.
    - group: monitoring.whatap.com
      kind: WhatapAgent

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
