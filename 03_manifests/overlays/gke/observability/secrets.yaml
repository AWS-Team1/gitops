# =========================================================
# 와탭 시크릿 — GKE
#
# EKS 는 Secrets Store CSI + Secrets Manager 를 쓰지만, GKE 쪽 앱은
# GKE Secret Manager 애드온의 SecretSync 를 쓴다
# (overlays/gke/shared/secret-sync.yaml 참조). 같은 방식으로 맞춘다.
#
# 앱 쪽 SecretProviderClass(bank-of-anthos-db-secrets)는 bank-of-anthos
# 네임스페이스에 있고, SecretSync 는 네임스페이스를 넘지 못한다.
# 그래서 monitoring 네임스페이스용을 따로 만든다.
#
# Secret Manager 에 아래 두 시크릿이 있어야 한다 — 인프라 담당이 만든다.
#   boa-whatap-application-license
#   boa-whatap-endpoint        (host,port 를 담은 JSON 이 아니라 host:port 문자열)
# =========================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-secret-sync
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "5"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: observability-secrets
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/kdt4-1-506106/secrets/boa-whatap-application-license/versions/latest"
        path: "application-license"
      - resourceName: "projects/kdt4-1-506106/secrets/boa-whatap-host/versions/latest"
        path: "whatap-host"
      - resourceName: "projects/kdt4-1-506106/secrets/boa-whatap-port/versions/latest"
        path: "whatap-port"
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: whatap-observability
  namespace: monitoring
  annotations:
    # 수집기(wave 10)보다 먼저 Secret 이 있어야 한다.
    argocd.argoproj.io/sync-wave: "7"
spec:
  serviceAccountName: observability-secret-sync
  secretProviderClassName: observability-secrets
  secretObject:
    type: Opaque
    data:
      - sourcePath: "application-license"
        targetKey: "application_license"
      - sourcePath: "whatap-host"
        targetKey: "host"
      - sourcePath: "whatap-port"
        targetKey: "port"
