# =========================================================
# 와탭 쿠버네티스 에이전트 — WhatapAgent CR
#
# 이 파일이 없으면 whatap-operator 는 설치되지만 아무것도 하지 않는다.
# 오퍼레이터는 WhatapAgent CR 을 감시하다가 그것이 생겨야
# master-agent(Deployment)와 node-agent(DaemonSet)를 만든다.
#
# 만드는 경로 — 구성도의 경로 4
#   node-agent (노드마다) ─┐
#   master-agent          ─┴→ 와탭 쿠버네티스 제품 프로젝트
#
# 이 경로는 OpenTelemetry 와 무관하다. 수집기도 사이드카도 거치지 않고
# 에이전트가 직접 수집 서버로 보낸다. 그래서 OTel 이 전부 죽어도 살아 있다.
#
# ---------------------------------------------------------
# 자격증명 — 2026-09-27부터 자동화됨
# ---------------------------------------------------------
# monitoring 네임스페이스의 SecretSync(observability/secrets.yaml)를 이
# 네임스페이스가 그대로 재사용하지 못하는 이유는 여전히 같다 — 쿠버네티스
# Secret은 네임스페이스를 못 넘고, GCP Workload Identity 바인딩도
# (네임스페이스, KSA 이름) 조합이라 그렇다.
#
# 그래서 whatap-monitoring 전용 ServiceAccount·SecretProviderClass·
# SecretSync를 overlays/gke/bootstrap/에 따로 뒀다(boa-whatap-bootstrap
# Application, wave -22 — 이 파일이 속한 whatap-operator보다 먼저 온다).
# GCP 쪽 IAM 바인딩은 Infra/gcp-observability가 만든다.
#
# whatap-credentials Secret은 이제 사람이 kubectl로 만들지 않는다 — Secret
# Manager의 boa-whatap-kubernetes-license · boa-whatap-host · boa-whatap-port
# 값만 인프라 담당이 콘솔에서 채워 두면, SecretSync가 자동으로 가져온다.
# 그 세 시크릿 자체는 Terraform이 만들지 않는다(AWS의 /boa/observability/*
# 와 같은 원칙 — 콘솔 전용).
# =========================================================
apiVersion: monitoring.whatap.com/v2alpha1
kind: WhatapAgent
metadata:
  name: whatap
  # namespace 를 적지 않는다 — 이 CR 은 scope: Cluster 다.
  # 적어도 API 서버가 무시하고, Argo CD 추적만 헷갈려진다.
  # 에이전트 파드는 오퍼레이터가 "자기 네임스페이스"에 만든다.
  annotations:
    # CRD 는 boa-whatap-operator Application(앱 단위 wave -15)이 설치한다.
    # 이 Application 은 wave -5 이므로 그보다 늦다. 앱 내부 wave 는
    # 수집기와 같은 10 을 쓴다 — 이 CR 은 monitoring 쪽 시크릿에 의존하지 않는다.
    argocd.argoproj.io/sync-wave: "10"
spec:
  features:
    k8sAgent:
      # 클러스터 단위 구성 정보를 모아 보낸다. 노드당이 아니라 클러스터당 하나다.
      masterAgent:
        enabled: true

      # 노드마다 뜨는 DaemonSet. 컨테이너 런타임 소켓을 읽어 파드·컨테이너
      # 지표를 만든다. 소켓 경로가 틀리면 파드는 Running 인데 지표가 비어 있다.
      nodeAgent:
        enabled: true

        # GKE 의 기본 런타임이다. 와탭 콘솔에서는 환경 = GKE 를 함께 고른다. 와탭 콘솔의 에이전트 설치 화면에서
        # 런타임을 고르면 아래 두 값이 자동으로 채워진다.
        runtime: containerd
        # runtimeSocketPath 는 차트 1.9.x 의 CRD 에만 있다. 1.7.6 CRD 에는 없어서
        # 적용해도 조용히 잘려 나간다(구조 스키마 pruning). Application 이
        # 1.9.11 을 고정하고 있으므로 이 값이 살아 있다.
        runtimeSocketPath: /var/run/containerd/containerd.sock

      # GPU 노드가 없다.
      gpuMonitoring:
        enabled: false

  # ---------------------------------------------------------
  # apm.instrumentation 은 켜지 않는다 — 의도적으로 비워 둔다
  # ---------------------------------------------------------
  # 와탭 오퍼레이터에도 자바·파이썬 자동계측 기능이 있다. 켜면 같은 파드에
  # 자바 에이전트가 둘 붙고 JAVA_TOOL_OPTIONS 가 충돌해 앱이 기동하지 못한다.
  #
  # 이 설계는 계측을 OpenTelemetry 로 통일한다(base/observability/instrumentation.yaml).
  # 그래야 목적지를 바꿀 때 수집기의 exporter 블록만 교체하면 된다.
  #
  # 같은 함정이 와탭 콘솔에도 있다 — 관리 > 에이전트 설치 화면의
  # "APM 자동 설치" 체크박스가 이 필드다. 반드시 끈 상태로 파일을 받는다.
