# =========================================================
# 수집기 게이트웨이 — GKE
#
# EKS 판과 다른 점만 여기 있다.
#   exporter  : awscloudwatchlogs/awsemf/awss3  →  googlecloud/googlemanagedprometheus
#   SA        : Pod Identity              →  Workload Identity
#   detectors : [env, eks, ec2]           →  [env, gcp]
#
# 같은 점 — 마스킹(redaction·transform), 와탭 사이드카, 파이프라인 순서.
# 마스킹 규칙이 두 클라우드에서 갈라지면 한쪽만 새는 상황이 생기므로 동일하게 둔다.
#
# 대기 사이트라 replicas 를 1 로 둔다. 페일오버 시 앱 replicas 와 함께 올린다.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  mode: deployment
  replicas: 1

  serviceAccount: otel-collector

  image: otel/opentelemetry-collector-contrib:0.137.0

  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

  additionalContainers:
    - name: whatap-otel
      image: whatap/whatap-otel:latest

      ports:
        - name: otlp-whatap
          containerPort: 6601
          protocol: TCP

      env:
        # 변수 이름은 OpenTelemetry 에이전트 전용이다. 쿠버네티스 에이전트의
        # WHATAP_LICENSE / WHATAP_HOST / WHATAP_PORT 와 이름이 다르다 —
        # 섞으면 에이전트가 액세스 키를 빈 값으로 읽고 조용히 접속에 실패한다.
        # 근거: docs.whatap.io/opentelemetry/install-agent "환경 변수로 설정하기"
        - name: WHATAP_ACCESSKEY
          valueFrom:
            secretKeyRef:
              name: whatap-observability
              key: application_license

        # 형식은 수집 서버 IP 두 개를 슬래시로 잇는다 — 1.1.1.1/2.2.2.2
        # 단일 IP 로 동작하는지는 확인되지 않았다(변경 내역 미결 항목).
        - name: WHATAP_SERVER_HOST
          valueFrom:
            secretKeyRef:
              name: whatap-observability
              key: host

        # 사이드카가 OTLP 를 "받는" 포트다. 같은 파드의 수집기가
        # otlp/whatap exporter 로 127.0.0.1:6601 에 보낸다.
        #
        # 6600 이 아니라 6601 인 이유 — 와탭 수집 서버 포트도 6600 이다.
        # 같은 숫자가 방향만 다른 두 뜻으로 쓰이면 반드시 헷갈린다.
        # 받는 쪽만 한 칸 올려 눈으로 구분되게 했다.
        #   6600 = 나가는 목적지 (와탭 수집 서버, 시크릿의 port 값)
        #   6601 = 들어오는 문   (이 사이드카)
        #
        # 기본값이 아니므로 이미지가 이 값을 실제로 따르는지 확인이 필요하다 —
        # 수집기 로그에 connection refused 가 없으면 따른 것이다.
        - name: WHATAP_OTEL_GRPC_SERVER_PORT
          value: "6601"

        - name: otel_metric_server_enabled
          value: "true"

        - name: otel_log_server_enabled
          value: "true"

        # URL 에 계좌번호가 들어가므로 http.route 를 앞에 둔다. EKS 와 동일하다.
        - name: otel_attr_tx_url_keys
          value: "http.route,url.template,http.target"

      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20

      k8sattributes:
        auth_type: serviceAccount
        passthrough: false

        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.container.name

          labels:
            - tag_name: app
              key: app
              from: pod

        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection

      # gcp 디텍터가 GKE 메타데이터 서버에서 프로젝트·리전·클러스터를 읽는다.
      resourcedetection:
        detectors: [env, gcp]
        timeout: 5s
        override: false

      resource:
        attributes:
          - key: cloud.provider
            value: gcp
            action: upsert
          - key: deployment.environment
            value: dev
            action: upsert

      # 마스킹 규칙은 EKS 와 한 글자도 다르지 않아야 한다.
      redaction:
        allow_all_keys: true

        blocked_key_patterns:
          - "url\\.full"
          - "url\\.query"
          - "http\\.url"
          - "http\\.target"
          - ".*authorization.*"
          - ".*password.*"
          - ".*secret.*"
          - ".*token.*"
          - ".*api[_-]?key.*"
          - ".*cookie.*"

          # ---------------------------------------------------------
          # 가입 정보 — 값으로는 못 거르는 것들
          # ---------------------------------------------------------
          # userservice 의 가입 요청에 들어오는 필드다(userservice.py:104-116).
          # 계좌번호·라우팅번호는 자리수 패턴으로 잡히지만 이름·생일·주소는
          # 값만 보고는 구분할 방법이 없다. 키 이름으로 거르는 수밖에 없다.
          #
          # accountid·account_num 은 여기 넣지 않는다 — 아래 blocked_values 와
          # transform 이 값을 이미 치환하므로, 키까지 지우면 상관관계 추적만
          # 잃고 얻는 게 없다.
          - ".*firstname.*"
          - ".*lastname.*"
          - ".*birthday.*"
          - ".*address.*"
          - ".*ssn.*"

        # ---------------------------------------------------------
        # 계좌·라우팅번호는 여기서 지우지 않는다 — 아래 transform 이 부분
        # 마스킹한다. redaction 은 transform 보다 먼저 돌고 값을 '통째로'
        # 지우므로, 여기 남겨 두면 끝 4자리를 보존할 기회가 사라진다.
        # 발표 자료의 ******7890 형식을 맞추려면 이 순서가 필요하다.
        #
        # SSN 만 남긴다. 이건 일부도 남기면 안 되는 값이다.
        # ---------------------------------------------------------
        blocked_values:
          # 주민등록·사회보장번호 형식. 가입 요청의 ssn 필드가 이 모양이다.
          # 이것만 여기 둔다 — 값을 통째로 지운다.
          #
          # Go 정규식(RE2)은 전방·후방 탐색을 지원하지 않는다. 앞서
          # "(?<![0-9])..." 로 적었다가 수집기가 기동조차 못 했다.
          # \b(단어 경계)는 RE2 가 지원하고 숫자가 단어 문자이므로,
          # 더 긴 숫자열 안쪽에는 걸리지 않는다.
          - "\\b[0-9]{3}-[0-9]{2}-[0-9]{4}\\b"

        summary: debug

      # 경로에 context 접두사(span. / log.)를 붙인다. 안 붙이면 수집기가
      # 기동 로그에 "one or more paths were modified to include their context
      # prefix, please rewrite them accordingly" 를 남기고 알아서 고쳐 쓴다.
      # 지금 동작은 같지만 명시해 두는 편이 낫다.
      #
      # 순서가 중요하다 — 10자리를 먼저 치환해야 한다. 9자리를 먼저 걸면
      # 10자리 숫자의 앞 9자리만 잘라먹고 한 자리가 남는다.
      transform:
        error_mode: ignore

        # ---------------------------------------------------------
        # 부분 마스킹 — 끝 6자리를 가린다
        # ---------------------------------------------------------
        # 10자리 계좌번호 1011226111 → 1011******
        #  9자리 라우팅번호  883745000 → 883******
        #
        # 앞부분을 $1 로 되살리고 뒤 6자리를 가린다. 계좌번호는 뒷자리가
        # 고유하므로 그쪽을 가려야 식별이 막힌다. 앞자리는 기관·지점 성격이라
        # 엔트로피가 낮고, 남겨 두면 조사 때 대략의 구분에는 쓸 수 있다.
        #
        # 경계(\b)를 반드시 붙인다. 경계 없이 [0-9]{10} 으로 걸면
        # 13자리 epoch 밀리초의 앞 10자리를 잘라먹어 타임스탬프가 깨진다.
        # 실측으로 확인했다 — 1790738520882 → {accountId}882.
        # 대신 "acct1011226111" 처럼 문자에 바로 붙은 경우는 놓친다.
        # 이 앱의 로그는 'account_num': '1011226111' 또는 /balances/1011226111
        # 형태라 항상 경계가 있어 문제되지 않는다.
        #
        # 10자리를 9자리보다 먼저 건다. 순서가 바뀌면 10자리의 앞 9자리만
        # 잘리고 한 자리가 남는다.
        #
        # 미검증 — OTTL replace_pattern 의 치환 문자열에서 캡처 그룹($1)이
        # 동작하는지 실행으로 확인하지 못했다. 안 되면 치환 결과가
        # "******$1" 문자열 그대로 나온다. 그 경우 전량 치환으로 되돌린다.
        #   replace_pattern(span.name, "\\b[0-9]{10}\\b", "{accountId}")
        trace_statements:
          - context: span
            statements:
              - replace_pattern(span.name, "\\b([0-9]{4})[0-9]{6}\\b", "$1******")
              - replace_pattern(span.name, "\\b([0-9]{3})[0-9]{6}\\b", "$1******")

              # 속성 맵 전체를 훑는다. 전에는 url.path 하나만 봐서
              # db.statement · exception.message · http.request.body 에 들어간
              # 계좌번호가 그대로 나갔다. redaction 의 blocked_values 는 값
              # '전체'가 그 형태일 때만 걸리므로 문장 안쪽은 못 잡는다.
              - replace_all_patterns(span.attributes, "value", "\\b([0-9]{4})[0-9]{6}\\b", "$1******")
              - replace_all_patterns(span.attributes, "value", "\\b([0-9]{3})[0-9]{6}\\b", "$1******")

              # JWT 치환이 로그에만 있었다. 자동계측이 요청 헤더를 캡처하므로
              # (instrumentation.yaml 의 CAPTURE_HEADERS) 스팬 속성에도 들어온다.
              - replace_all_patterns(span.attributes, "value", "eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}", "{jwt}")
              - replace_all_patterns(span.attributes, "value", "\\b[0-9]{3}-[0-9]{2}-[0-9]{4}\\b", "{ssn}")

        log_statements:
          - context: log
            statements:
              - replace_pattern(log.body, "\\b([0-9]{4})[0-9]{6}\\b", "$1******")
              - replace_pattern(log.body, "\\b([0-9]{3})[0-9]{6}\\b", "$1******")
              - replace_pattern(log.body, "eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}", "{jwt}")

              - replace_all_patterns(log.attributes, "value", "\\b([0-9]{4})[0-9]{6}\\b", "$1******")
              - replace_all_patterns(log.attributes, "value", "\\b([0-9]{3})[0-9]{6}\\b", "$1******")
              - replace_all_patterns(log.attributes, "value", "eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}", "{jwt}")

              # ---------------------------------------------------------
              # 가입 요청 본문 — redaction 이 못 잡는 자리
              # ---------------------------------------------------------
              # redaction 의 blocked_key_patterns 는 '속성'에만 걸린다.
              # 그런데 앱이 요청 dict 를 통째로 본문 문자열에 찍는다 —
              #   userservice.py:192  logger.debug('validating create user request: %s', str(req))
              #   contacts.py:155     logger.debug('validating add contact request: %s', str(req))
              # req 는 평범한 dict 라 본문이 {'ssn': '...', 'password': '...'} 모양이 된다.
              # 즉 키가 본문 '안'에 있어서 키 필터가 닿지 않는다. 여기서 잡는다.
              #
              # 이름·생일·주소는 값만 보고 구분할 방법이 없으므로
              # 'key': 'value' 쌍을 통째로 바꾼다.
              # 치환 문자열에 "콜론 + 공백" 을 넣지 말 것. YAML 평문 스칼라가
              # ": " 를 매핑 키 구분자로 읽어 파일 전체 파싱이 깨진다.
              - replace_pattern(log.body, "'password[^']*':\\s*'[^']*'", "'password':'{redacted}'")
              - replace_pattern(log.body, "'ssn':\\s*'[^']*'", "'ssn':'{redacted}'")
              - replace_pattern(log.body, "'firstname':\\s*'[^']*'", "'firstname':'{redacted}'")
              - replace_pattern(log.body, "'lastname':\\s*'[^']*'", "'lastname':'{redacted}'")
              - replace_pattern(log.body, "'birthday':\\s*'[^']*'", "'birthday':'{redacted}'")
              - replace_pattern(log.body, "'address':\\s*'[^']*'", "'address':'{redacted}'")

              # 값 형식으로 잡히는 것은 따로 한 번 더 — 본문 어디에 있든 걸린다.
              - replace_pattern(log.body, "\\b[0-9]{3}-[0-9]{2}-[0-9]{4}\\b", "{ssn}")

      batch:
        send_batch_size: 8192
        send_batch_max_size: 10000
        timeout: 5s

    exporters:
      otlp/whatap:
        endpoint: 127.0.0.1:6601
        tls:
          insecure: true

        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000

      # Cloud Logging · Cloud Trace. GKE 는 이 둘이 이미 켜져 있으므로
      # 로그는 중복될 수 있다 — 아래 파이프라인에서 로그는 와탭으로만 보낸다.
      googlecloud:
        project: kdt4-1-506106

        log:
          default_log_name: otel-gateway

      # 지표는 Managed Service for Prometheus 로 보낸다. CloudWatch 의
      # awsemf 자리에 해당한다.
      googlemanagedprometheus:
        project: kdt4-1-506106

      debug:
        verbosity: basic

    service:
      telemetry:
        logs:
          level: info

      pipelines:
        traces:
          receivers: [otlp]
          processors:
            - memory_limiter
            - k8sattributes
            - resourcedetection
            - resource
            - redaction
            - transform
            - batch
          exporters: [otlp/whatap, googlecloud]

        metrics:
          receivers: [otlp]
          processors:
            - memory_limiter
            - k8sattributes
            - resourcedetection
            - resource
            - batch
          exporters: [otlp/whatap, googlemanagedprometheus]

        # 로그를 googlecloud 로 보내지 않는다. GKE 의 logging.googleapis.com/kubernetes
        # 가 이미 컨테이너 stdout 을 Cloud Logging 에 넣고 있어서 두 배가 된다.
        logs:
          receivers: [otlp]
          processors:
            - memory_limiter
            - k8sattributes
            - resourcedetection
            - resource
            - redaction
            - transform
            - batch
          exporters: [otlp/whatap]
