# =========================================================
# 수집기 게이트웨이 — GKE
#
# EKS 판과 다른 점만 여기 있다.
#   exporter  : awscloudwatchlogs/awsemf/awss3  →  googlecloud/googlemanagedprometheus
#   SA        : Pod Identity              →  Workload Identity
#   detectors : [env, eks, ec2]           →  [env, gcp]
#
# 같은 점 — 마스킹(redaction·transform), 와탭 사이드카, 파이프라인 순서.
# 마스킹 규칙이 두 클라우드에서 갈라지면 한쪽만 새는 상황이 생기므로 동일하게 둔다.
#
# 대기 사이트라 replicas 를 1 로 둔다. 페일오버 시 앱 replicas 와 함께 올린다.
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  mode: deployment
  replicas: 1

  serviceAccount: otel-collector

  image: otel/opentelemetry-collector-contrib:0.137.0

  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

  additionalContainers:
    - name: whatap-otel
      image: whatap/whatap-otel:latest

      ports:
        - name: otlp-whatap
          containerPort: 6601
          protocol: TCP

      env:
        # 변수 이름은 OpenTelemetry 에이전트 전용이다. 쿠버네티스 에이전트의
        # WHATAP_LICENSE / WHATAP_HOST / WHATAP_PORT 와 이름이 다르다 —
        # 섞으면 에이전트가 액세스 키를 빈 값으로 읽고 조용히 접속에 실패한다.
        # 근거: docs.whatap.io/opentelemetry/install-agent "환경 변수로 설정하기"
        - name: WHATAP_ACCESSKEY
          valueFrom:
            secretKeyRef:
              name: whatap-observability
              key: application_license

        # 형식은 수집 서버 IP 두 개를 슬래시로 잇는다 — 1.1.1.1/2.2.2.2
        # 단일 IP 로 동작하는지는 확인되지 않았다(변경 내역 미결 항목).
        - name: WHATAP_SERVER_HOST
          valueFrom:
            secretKeyRef:
              name: whatap-observability
              key: host

        # 사이드카가 OTLP 를 "받는" 포트다. 같은 파드의 수집기가
        # otlp/whatap exporter 로 127.0.0.1:6601 에 보낸다.
        #
        # 6600 이 아니라 6601 인 이유 — 와탭 수집 서버 포트도 6600 이다.
        # 같은 숫자가 방향만 다른 두 뜻으로 쓰이면 반드시 헷갈린다.
        # 받는 쪽만 한 칸 올려 눈으로 구분되게 했다.
        #   6600 = 나가는 목적지 (와탭 수집 서버, 시크릿의 port 값)
        #   6601 = 들어오는 문   (이 사이드카)
        #
        # 기본값이 아니므로 이미지가 이 값을 실제로 따르는지 확인이 필요하다 —
        # 수집기 로그에 connection refused 가 없으면 따른 것이다.
        - name: WHATAP_OTEL_GRPC_SERVER_PORT
          value: "6601"

        - name: otel_metric_server_enabled
          value: "true"

        - name: otel_log_server_enabled
          value: "true"

        # URL 에 계좌번호가 들어가므로 http.route 를 앞에 둔다. EKS 와 동일하다.
        - name: otel_attr_tx_url_keys
          value: "http.route,url.template,http.target"

      resources:
        limits:
          cpu: 500m
          memory: 512Mi
        requests:
          cpu: 100m
          memory: 256Mi

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20

      k8sattributes:
        auth_type: serviceAccount
        passthrough: false

        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.node.name
            - k8s.container.name

          labels:
            - tag_name: app
              key: app
              from: pod

        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection

      # gcp 디텍터가 GKE 메타데이터 서버에서 프로젝트·리전·클러스터를 읽는다.
      resourcedetection:
        detectors: [env, gcp]
        timeout: 5s
        override: false

      resource:
        attributes:
          - key: cloud.provider
            value: gcp
            action: upsert
          - key: deployment.environment
            value: dev
            action: upsert

      # 마스킹 규칙은 EKS 와 한 글자도 다르지 않아야 한다.
      redaction:
        allow_all_keys: true

        blocked_key_patterns:
          - "url\\.full"
          - "url\\.query"
          - "http\\.url"
          - "http\\.target"
          - ".*authorization.*"
          - ".*password.*"
          - ".*secret.*"
          - ".*token.*"
          - ".*api[_-]?key.*"
          - ".*cookie.*"

        blocked_values:
          # Go 정규식(RE2)은 전방·후방 탐색을 지원하지 않는다. 앞서
          # "(?<![0-9])[0-9]{10}(?![0-9])" 로 적었다가 수집기가 기동조차
          # 못 했다 — invalid named capture 로 파이프라인 구성에서 실패한다.
          #
          # \b(단어 경계)는 RE2 가 지원하고, 숫자는 단어 문자이므로 더 긴
          # 숫자열 안쪽에는 걸리지 않는다. 13자리 epoch 밀리초를 계좌번호로
          # 오인하지 않는다는 원래 의도가 그대로 유지된다.
          #
          # 원본과 다른 점 — 문자·밑줄에 바로 붙은 경우("acct1234567890")는
          # 여기서 안 걸린다. 그 경우는 아래 transform 의 replace_pattern 이
          # 경계 없이 [0-9]{10} 으로 잡으므로 두 겹으로 덮인다.
          - "\\b[0-9]{10}\\b"

        summary: debug

      transform:
        error_mode: ignore

        trace_statements:
          - context: span
            statements:
              - replace_pattern(name, "[0-9]{10}", "{accountId}")
              - replace_pattern(attributes["url.path"], "[0-9]{10}", "{accountId}")

        log_statements:
          - context: log
            statements:
              - replace_pattern(body, "[0-9]{10}", "{accountId}")
              - replace_pattern(body, "eyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}", "{jwt}")

      batch:
        send_batch_size: 8192
        send_batch_max_size: 10000
        timeout: 5s

    exporters:
      otlp/whatap:
        endpoint: 127.0.0.1:6601
        tls:
          insecure: true

        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

        sending_queue:
          enabled: true
          num_consumers: 4
          queue_size: 1000

      # Cloud Logging · Cloud Trace. GKE 는 이 둘이 이미 켜져 있으므로
      # 로그는 중복될 수 있다 — 아래 파이프라인에서 로그는 와탭으로만 보낸다.
      googlecloud:
        project: kdt4-1-506106

        log:
          default_log_name: otel-gateway

      # 지표는 Managed Service for Prometheus 로 보낸다. CloudWatch 의
      # awsemf 자리에 해당한다.
      googlemanagedprometheus:
        project: kdt4-1-506106

      debug:
        verbosity: basic

    service:
      telemetry:
        logs:
          level: info

      pipelines:
        traces:
          receivers: [otlp]
          processors:
            - memory_limiter
            - k8sattributes
            - resourcedetection
            - resource
            - redaction
            - transform
            - batch
          exporters: [otlp/whatap, googlecloud]

        metrics:
          receivers: [otlp]
          processors:
            - memory_limiter
            - k8sattributes
            - resourcedetection
            - resource
            - batch
          exporters: [otlp/whatap, googlemanagedprometheus]

        # 로그를 googlecloud 로 보내지 않는다. GKE 의 logging.googleapis.com/kubernetes
        # 가 이미 컨테이너 stdout 을 Cloud Logging 에 넣고 있어서 두 배가 된다.
        logs:
          receivers: [otlp]
          processors:
            - memory_limiter
            - k8sattributes
            - resourcedetection
            - resource
            - redaction
            - transform
            - batch
          exporters: [otlp/whatap]
