apiVersion: apps/v1
kind: Deployment
metadata:
  name: contacts
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: contacts
          image: asia-northeast2-docker.pkg.dev/kdt4-1-506106/bank-of-anthos/boa-contacts:sha-9b9dbb44d7375e5cf0f2ebab87616ac8885bc5dd
          env:
            - name: POSTGRES_USER
              value: "accounts_app"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: accounts-db-secret
                  key: password
            - name: ACCOUNTS_DB_URI
              value: "postgresql+psycopg2://$(POSTGRES_USER)@10.50.1.11:5432/accountsdb?sslmode=require"
      volumes:
        - $patch: replace
        - name: secrets-store
          secret:
            secretName: bank-app-jwt
            items:
              - key: jwtRS256.key.pub
                path: jwtRS256.key.pub
