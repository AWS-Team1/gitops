apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bank-of-anthos
resources:
  - ../../../base/accounts
patches:
  - path: userservice.yaml
  - path: contacts.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: userservice-networkpolicy
    patch: &cloud-sql-egress |-
      - op: replace
        path: /spec/egress/0/to
        value:
          - ipBlock:
              cidr: 10.50.1.5/32
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: contacts-networkpolicy
    patch: *cloud-sql-egress
