apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: frontend
spec:
  healthCheck:
    type: HTTP
    requestPath: /ready
    port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boa-ingress
  annotations:
    kubernetes.io/ingress.class: gce
spec:
  defaultBackend:
    service:
      name: frontend
      port:
        number: 8080
