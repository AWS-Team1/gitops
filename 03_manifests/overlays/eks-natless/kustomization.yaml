apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - shared
  - accounts
  - ledger
  - frontend
images:
  - name: public.ecr.aws/docker/library/busybox
    newName: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/boa-busybox
    newTag: 1.36.1
  - name: postgres
    newName: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/boa-postgres
    newTag: "16"
patches:
  - target:
      kind: Namespace
      name: bank-of-anthos
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: bank-of-anthos
      $patch: delete
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: "^(balancereader|contacts|frontend|ledgerwriter|transactionhistory|userservice)$"
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0
