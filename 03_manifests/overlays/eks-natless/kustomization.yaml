apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../eks
images:
  - name: public.ecr.aws/docker/library/busybox
    newName: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/boa-busybox
    newTag: 1.36.1
  - name: postgres
    newName: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/boa-postgres
    newTag: "16"
patches:
  - target:
      kind: Namespace
      name: bank-of-anthos
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: bank-of-anthos
      $patch: delete
  - target:
      kind: NetworkPolicy
      name: frontend-networkpolicy
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/ipBlock/cidr
        value: 10.0.0.0/24
      - op: replace
        path: /spec/ingress/0/from/1/ipBlock/cidr
        value: 10.0.1.0/24
  - target:
      kind: Ingress
      name: boa-ingress
    patch: |-
      - op: add
        path: /metadata/annotations/alb.ingress.kubernetes.io~1healthcheck-path
        value: /ready