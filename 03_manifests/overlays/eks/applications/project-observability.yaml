# =========================================================
# 관측 전용 AppProject
#
# 왜 나눴나 — clusterResourceWhitelist 는 Application 별이 아니라
# AppProject 전체의 허용 목록이다. 관측 스택 때문에 boa 에 클러스터 스코프
# 8종을 열어 두면, 같은 프로젝트에 속한 boa-accounts·boa-ledger 같은 앱
# Application 도 Git 에 ClusterRole 을 넣기만 하면 Argo CD 가 적용해 준다.
#
# 렌더로 확인한 결과 앱 오버레이 4개가 만드는 클러스터 스코프 리소스는
# shared 의 Namespace 하나뿐이다. 그래서 관측을 떼어내면 boa 를 8종에서
# 1종으로 되돌릴 수 있다(그 축소는 별도 단계 — 아래 참조).
#
# 주의 — 이것은 "실수 방지 장치"이지 침해 방어선이 아니다. Argo CD 컨트롤러
# 자신의 쿠버네티스 RBAC 은 그대로다. 컨트롤러가 탈취되면 AppProject 는
# 아무것도 막지 못한다.
# =========================================================
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: boa-observability
  namespace: argocd
  annotations:
    # boa 와 같은 wave. 이 프로젝트를 참조하는 Application 중 가장 이른 것이
    # boa-external-secrets(-28)이므로 그보다 먼저 있어야 한다.
    argocd.argoproj.io/sync-wave: "-30"
spec:
  # ---------------------------------------------------------
  # 허용 저장소
  # ---------------------------------------------------------
  # Application 의 repoURL 과 문자열로 정확히 같아야 한다. 하나라도 어긋나면
  # "application repo ... is not permitted in project" 로 막힌다.
  sourceRepos:
    # boa-monitoring · boa-whatap-bootstrap 이 읽는 곳
    - https://github.com/AWS-Team1/gitops.git

    - https://charts.jetstack.io
    - https://open-telemetry.github.io/opentelemetry-helm-charts
    - https://whatap.github.io/helm

    # 302 로 external-secrets.io 로 넘어가지만 helm 이 따라간다.
    - https://charts.external-secrets.io

  # ---------------------------------------------------------
  # 허용 대상 네임스페이스
  # ---------------------------------------------------------
  destinations:
    # 수집기 · Grafana · 시크릿
    - server: https://kubernetes.default.svc
      namespace: monitoring

    # 와탭 오퍼레이터 · 에이전트 2종 · whatap-credentials
    - server: https://kubernetes.default.svc
      namespace: whatap-monitoring

    # 오퍼레이터 웹훅 인증서 발급
    - server: https://kubernetes.default.svc
      namespace: cert-manager

    # OpenTelemetry 오퍼레이터
    - server: https://kubernetes.default.svc
      namespace: opentelemetry-operator-system

    # External Secrets Operator 컨트롤러 (EKS 에만 있다)
    - server: https://kubernetes.default.svc
      namespace: external-secrets

    # -----------------------------------------------------
    # 놓치기 쉬운 둘
    # -----------------------------------------------------
    # cert-manager 차트가 global.leaderElection.namespace 기본값 kube-system
    # 으로 Role·RoleBinding 4개를 렌더한다(v1.19.1 templates/rbac.yaml:3,27 ·
    # cainjector-rbac.yaml:55,84). 우리가 의도한 게 아니라 차트가 그렇게
    # 만든다. 이 destination 이 없으면 cert-manager Application 이 막힌다.
    - server: https://kubernetes.default.svc
      namespace: kube-system

    # Instrumentation/boa 가 앱 네임스페이스에 있다. 관측 프로젝트가 앱
    # 네임스페이스를 허용해야 하는, 직관에 어긋나는 항목이다.
    #
    # 여기서 분리의 이득이 샌다 — namespaceResourceWhitelist 는 프로젝트
    # 전체 단위라 "bank-of-anthos 에는 Instrumentation 만"이라고 쓸 수 없다.
    # 즉 관측 프로젝트가 앱 네임스페이스에 아무 네임스페이스 리소스나 만들 수
    # 있게 된다.
    #
    # 없애려면 Instrumentation 을 monitoring 으로 옮기고 앱 파드 6종의
    # 어노테이션을 "monitoring/boa" 로 바꾸면 된다. 앱 매니페스트를 건드리고
    # 앱 파드가 전부 롤링 재시작되므로 별도 건으로 남겨 둔다(미결).
    - server: https://kubernetes.default.svc
      namespace: bank-of-anthos

  # ---------------------------------------------------------
  # 허용 클러스터 스코프 리소스
  # ---------------------------------------------------------
  clusterResourceWhitelist:
    # base/observability/namespace.yaml 의 monitoring
    - group: ""
      kind: Namespace

    # cert-manager · 오퍼레이터 · 와탭 · ESO 차트가 CRD 를 설치한다
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition

    # 수집기가 파드·노드를 클러스터 전역으로 읽는다
    - group: rbac.authorization.k8s.io
      kind: ClusterRole

    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding

    # 오퍼레이터의 자동계측 변경 웹훅 · ESO 검증 웹훅
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration

    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration

    # whatap-bootstrap/clustersecretstore.yaml
    - group: external-secrets.io
      kind: ClusterSecretStore

    # WhatapAgent 는 CRD 가 scope: Cluster 다(차트 1.9.11
    # templates/crd-whatapagents.yaml:15). 13항에서 이게 빠져 배포가 막혔다.
    - group: monitoring.whatap.com
      kind: WhatapAgent

  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"

  # ---------------------------------------------------------
  # 미결 — boa 프로젝트 축소
  # ---------------------------------------------------------
  # 이 프로젝트가 생겨도 boa 는 아직 관측용 권한을 그대로 갖고 있다.
  # 일부러 남겼다 — 관측 Application 이 새 프로젝트에서 Healthy 가 되는 것을
  # 확인하기 전에 옛 권한을 지우면 되돌릴 자리가 없어진다.
  #
  # 초록을 확인한 뒤 boa 에서 뺄 것
  #   sourceRepos  : 차트 저장소 4개
  #   destinations : monitoring · whatap-monitoring · cert-manager ·
  #                  opentelemetry-operator-system · external-secrets
  #   clusterResourceWhitelist : Namespace 만 남기고 전부
