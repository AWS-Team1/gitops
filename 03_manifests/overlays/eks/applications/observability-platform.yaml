# =========================================================
# 관측 플랫폼 — Helm 차트 3개
#
# 순서가 강제된다. sync-wave 로 표현했다.
#   -25  cert-manager        : 오퍼레이터의 변경 웹훅 인증서를 발급한다
#   -20  otel-operator       : OpenTelemetryCollector · Instrumentation CRD 를 만든다
#   -15  whatap-operator     : 와탭 쿠버네티스 에이전트(클러스터 지표)
#
# 이 wave 가 앱 Application(-10)보다 앞이라는 것이 핵심이다. 앱보다 늦으면
# 앱 파드가 먼저 떠서 어노테이션이 무시된 채 기동하고, 계측을 붙이려면
# 파드를 한 번 더 굴려야 한다.
#
# cert-manager 를 빼면 오퍼레이터가 웹훅 인증서를 못 만들고, CR 을 적용할 때
# "failed calling webhook" 으로 멈춘다. 오퍼레이터 차트에 자체 생성 옵션이
# 있지만 업스트림이 cert-manager 를 전제로 하므로 그대로 따른다.
# =========================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boa-cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  project: boa

  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.19.1

    helm:
      releaseName: cert-manager

      valuesObject:
        # CRD 를 차트가 같이 설치하게 한다. 따로 설치하면 업그레이드 때 어긋난다.
        crds:
          enabled: true
          keep: true

        # 실습 환경이라 1개씩. 프로덕션이면 controller 를 2 이상으로.
        replicaCount: 1

        webhook:
          replicaCount: 1

        cainjector:
          replicaCount: 1

        # ACME 를 쓰지 않는다 — 웹훅 인증서 발급 전용이다.
        # 외부 DNS 조회를 시도하지 않게 한다.
        prometheus:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      # CRD 가 커서 kubectl apply 의 어노테이션 크기 한계를 넘는다.
      - ServerSideApply=true
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boa-otel-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: boa

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.99.0

    helm:
      releaseName: opentelemetry-operator

      valuesObject:
        # 이 차트는 manager 이미지 저장소를 명시적으로 요구한다.
        manager:
          collectorImage:
            repository: otel/opentelemetry-collector-contrib

          # 오퍼레이터가 만드는 수집기의 기본 이미지다. 우리 CR 이 spec.image 로
          # 덮어쓰므로 실제로는 쓰이지 않지만, 비워 두면 차트가 렌더에 실패한다.
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi

        admissionWebhooks:
          certManager:
            # cert-manager 가 웹훅 인증서를 발급한다. 위 Application 이 먼저다.
            enabled: true

          # autoInstrumentation 웹훅. 이것이 어노테이션을 읽는 주체다 —
          # 끄면 계측이 전혀 붙지 않는다.
          autoInstrumentationWebhook:
            enabled: true

        # 오퍼레이터 자신의 지표는 쓰지 않는다.
        kubeRBACProxy:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-operator-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
---
# 와탭 쿠버네티스 에이전트.
#
# 왜 필요한가 — 와탭 애플리케이션 제품(APM)은 트레이스·지표·로그를 받지만
# 노드·파드 자원 지표를 쿠버네티스 제품에서 본다. 둘은 별개 프로젝트이고
# 액세스 키도 다르다.
#
# 중복 주의 — 이 에이전트의 노드 에이전트가 컨테이너 로그를 수집한다.
# 우리 수집기의 filelog 가 이미 플랫폼 로그를 읽고 있고, 앱 로그는 OTLP 로
# 들어온다. 와탭 노드 에이전트의 로그 수집을 끄지 않으면 같은 로그가 세 번
# 들어갈 수 있다 — 아래 values 에서 명시적으로 끈다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boa-whatap-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  project: boa

  source:
    repoURL: https://whatap-cloud.github.io/whatap-operator
    chart: whatap-operator
    targetRevision: 1.7.6

    helm:
      releaseName: whatap-operator

      valuesObject:
        # 라이선스 키를 values 에 넣지 않는다. 오퍼레이터가 만드는 CR 에서
        # 시크릿을 참조하게 하고, 시크릿은 Secrets Manager 에서 온다.
        # 차트 버전에 따라 키 이름이 다르므로 apply 후 실제 필드를 확인한다.
        whatap:
          licenseSecret:
            name: whatap-observability
            key: kubernetes_license

  destination:
    server: https://kubernetes.default.svc
    namespace: whatap-monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
