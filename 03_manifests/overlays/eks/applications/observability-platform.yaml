# =========================================================
# 관측 플랫폼 — Helm 차트 4개 + 시크릿 기반
#
# 순서가 강제된다. sync-wave 로 표현했다.
#   -28  external-secrets    : 시크릿을 Secrets Manager 에서 끌어오는 컨트롤러
#   -25  cert-manager        : 오퍼레이터의 변경 웹훅 인증서를 발급한다
#   -22  obs-bootstrap       : 네임스페이스 · ClusterSecretStore · whatap-credentials
#   -20  otel-operator       : OpenTelemetryCollector · Instrumentation CRD 를 만든다
#   -15  whatap-operator     : 와탭 쿠버네티스 에이전트(클러스터 지표)
#
# 이 wave 가 앱 Application(-10)보다 앞이라는 것이 핵심이다. 앱보다 늦으면
# 앱 파드가 먼저 떠서 어노테이션이 무시된 채 기동하고, 계측을 붙이려면
# 파드를 한 번 더 굴려야 한다.
#
# cert-manager 를 빼면 오퍼레이터가 웹훅 인증서를 못 만들고, CR 을 적용할 때
# "failed calling webhook" 으로 멈춘다. 오퍼레이터 차트에 자체 생성 옵션이
# 있지만 업스트림이 cert-manager 를 전제로 하므로 그대로 따른다.
#
# external-secrets 가 맨 앞인 이유 — 와탭 오퍼레이터 Deployment 가
# whatap-credentials 시크릿을 secretKeyRef 로 직접 읽고 optional 이 아니다.
# 시크릿이 없으면 오퍼레이터 파드가 기동조차 못 한다. 그래서 그 시크릿을
# 만드는 것이 오퍼레이터(-15)보다 확실히 앞서야 한다.
# =========================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boa-external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-28"
spec:
  project: boa

  source:
    # 이 주소는 302 로 external-secrets.io 로 넘어간다. helm 이 따라가므로
    # 공식 문서에 적힌 주소를 그대로 쓴다. AppProject 의 sourceRepos 도
    # 같은 문자열이어야 한다.
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.11.0

    helm:
      releaseName: external-secrets

      valuesObject:
        # CRD 를 차트가 같이 설치한다. ExternalSecret · ClusterSecretStore 가
        # 여기서 생긴다 — API 는 external-secrets.io/v1 이다(v1beta1 은 폐기).
        installCRDs: true

        # 실습 환경이라 1개씩.
        replicaCount: 1

        certController:
          replicaCount: 1

        serviceAccount:
          create: true

          # 이름을 고정한다. Pod Identity 연결이 (클러스터, 네임스페이스, SA)
          # 문자열 일치로만 동작하므로, 차트 기본값에 맡기면 Terraform 쪽과
          # 어긋났을 때 조용히 자격증명이 안 붙는다.
          name: external-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      # CRD 가 커서 kubectl apply 의 어노테이션 크기 한계를 넘는다.
      - ServerSideApply=true
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
---
# 관측 스택이 서기 전에 먼저 있어야 하는 것들 — 네임스페이스 하나,
# ClusterSecretStore 하나, whatap-credentials 시크릿 하나.
#
# 관측 Application(wave -5)에 두지 않고 따로 뺀 이유는 순서 하나다.
# whatap-credentials 는 와탭 오퍼레이터(-15)보다 먼저 있어야 하는데
# -5 는 너무 늦다. 그리고 -25 ~ -15 의 나머지 Application 은 전부 외부 Helm
# 차트를 가리켜서 우리 YAML 을 끼워 넣을 자리가 없다. 그래서 그릇을 새로 만들었다.
#
# 이름이 secret-stores 가 아닌 이유 — 시크릿만 담지 않는다. 네임스페이스를
# 만들고(PSA 라벨을 붙이려면 우리가 선언해야 한다) 금고 설정도 여기 있다.
#
# 주의 — Argo CD 는 모르는 사용자 정의 리소스를 기본적으로 Healthy 로 친다.
# ExternalSecret 을 적용하자마자 다음 wave 로 넘어가므로, 실제로 Secret 이
# 만들어지기까지의 몇 초는 wave 가 보장해 주지 않는다. 그 사이 오퍼레이터
# 파드는 CreateContainerConfigError 로 기다리다 스스로 회복한다.
# 엄밀히 막으려면 argocd-cm 에 ExternalSecret 헬스 판정을 넣어야 한다(미결).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boa-whatap-bootstrap
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-22"
spec:
  project: boa

  source:
    repoURL: https://github.com/AWS-Team1/gitops.git
    # boa-eks-root 와 같은 배포 브랜치를 고정한다. HEAD(기본 브랜치)를 쓰면
    # dev-0922 에만 있는 bootstrap 매니페스트를 찾지 못할 수 있다.
    targetRevision: dev-0922
    path: 03_manifests/overlays/eks/whatap-bootstrap

  destination:
    server: https://kubernetes.default.svc
    namespace: whatap-monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - ServerSideApply=true
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boa-cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  project: boa

  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.19.1

    helm:
      releaseName: cert-manager

      valuesObject:
        # CRD 를 차트가 같이 설치하게 한다. 따로 설치하면 업그레이드 때 어긋난다.
        crds:
          enabled: true
          keep: true

        # 실습 환경이라 1개씩. 프로덕션이면 controller 를 2 이상으로.
        replicaCount: 1

        webhook:
          replicaCount: 1

        cainjector:
          replicaCount: 1

        # ACME 를 쓰지 않는다 — 웹훅 인증서 발급 전용이다.
        # 외부 DNS 조회를 시도하지 않게 한다.
        prometheus:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      # CRD 가 커서 kubectl apply 의 어노테이션 크기 한계를 넘는다.
      - ServerSideApply=true
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boa-otel-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: boa

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-operator
    targetRevision: 0.99.0

    helm:
      releaseName: opentelemetry-operator

      valuesObject:
        manager:
          # 오퍼레이터가 만드는 수집기 파드의 기본 이미지다. 우리 CR 이
          # spec.image 로 덮어쓰므로 실제로는 쓰이지 않지만, 차트가 이 값을
          # --collector-image 인자로 넘기므로 저장소는 명시해 둔다.
          collectorImage:
            repository: otel/opentelemetry-collector-contrib

          # 오퍼레이터 자신의 자원 한도다(차트 기본값은 비어 있음).
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi

        admissionWebhooks:
          certManager:
            # cert-manager 가 웹훅 인증서를 발급한다. 위 Application 이 먼저다.
            enabled: true

          # 계측 주입 웹훅을 켜고 끄는 값은 이 차트에 없다.
          # admissionWebhooks.create(기본 true)면 파드 변경 웹훅(mpod.kb.io)이
          # 무조건 함께 만들어진다 — 0.99.0
          # templates/admission-webhooks/operator-webhook-with-cert-manager.yaml:91.
          #
          # 여기에 autoInstrumentationWebhook.enabled 를 넣었다가 차트
          # values.schema.json 의 admissionWebhooks.additionalProperties:false
          # 에 걸려 Argo CD 가 렌더 단계에서 실패했다(2026-09-26). 스키마가
          # 허용하는 하위 키는 create·servicePort·failurePolicy·secretName·
          # pods·namePrefix·timeoutSeconds·namespaceSelector·objectSelector·
          # certManager·autoGenerateCert·certFile·keyFile·caFile·
          # serviceAnnotations·secretAnnotations·secretLabels 뿐이다.
          pods:
            # 웹훅 파드가 준비되지 않았을 때 앱 파드 생성을 막지 않는다.
            # Fail 로 두면 오퍼레이터 장애가 앱 배포 장애로 번진다.
            # 대신 그 사이에 뜬 파드에는 계측이 붙지 않으므로, 오퍼레이터를
            # 손본 뒤에는 앱 파드를 한 번 굴려야 한다.
            failurePolicy: Ignore

        # 오퍼레이터 자신의 지표는 쓰지 않는다.
        kubeRBACProxy:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: opentelemetry-operator-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
---
# 와탭 쿠버네티스 에이전트.
#
# 왜 필요한가 — 와탭 애플리케이션 제품(APM)은 트레이스·지표·로그를 받지만
# 노드·파드 자원 지표를 쿠버네티스 제품에서 본다. 둘은 별개 프로젝트이고
# 액세스 키도 다르다.
#
# 로그 중복은 없다(확인함) — 노드 에이전트는 노드·파드·컨테이너 자원 지표만
# 보낸다. 차트 1.9.11 의 WhatapAgent CRD 에 로그 수집 필드가 아예 없고,
# templates/agent-node-configmap.yaml 이 만드는 whatap.node.conf 에도
# 로그 관련 설정이 없다. 우리 수집기의 filelog 와 겹치지 않는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boa-whatap-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  project: boa

  source:
    repoURL: https://whatap.github.io/helm
    chart: whatap-operator
    targetRevision: 1.9.11

    helm:
      releaseName: whatap-operator

      valuesObject:
        # 라이선스 키를 values 에 넣지 않는다. create:false 로 두면 차트는
        # 시크릿을 만들지 않고, 에이전트가 이 네임스페이스의 기존 시크릿을 읽는다.
        #
        # 시크릿 이름은 차트에 고정되어 있다 — whatap-credentials.
        # values 로 바꿀 수 없다(templates/secret-whatap-credentials.yaml:6).
        # 키 이름도 고정이다 — WHATAP_LICENSE · WHATAP_HOST · WHATAP_PORT.
        # 만드는 명령은 overlays/*/observability/whatap-agent.yaml 머리말에 있다.
        credentials:
          create: false

  destination:
    server: https://kubernetes.default.svc
    namespace: whatap-monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true

    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
