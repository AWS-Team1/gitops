# =========================================================
# whatap-credentials — 사람이 만들던 것을 대체한다
#
# 이 파일이 없던 동안에는 아래 명령을 사람이 직접 쳤다.
#
#   kubectl create secret generic whatap-credentials \
#     --namespace whatap-monitoring \
#     --from-literal WHATAP_LICENSE=... --from-literal WHATAP_HOST=... \
#     --from-literal WHATAP_PORT=6600
#
# 클러스터를 다시 만들 때마다 반복해야 했고, 잊으면 에이전트가 조용히 죽었다.
#
# ---------------------------------------------------------
# 이름과 키를 바꿀 수 없다
# ---------------------------------------------------------
# 시크릿 이름 whatap-credentials 는 와탭 차트에 고정되어 있다
# (templates/secret-whatap-credentials.yaml:6). values 로 바꿀 수 없다.
# 키 이름 WHATAP_LICENSE · WHATAP_HOST · WHATAP_PORT 도 마찬가지다.
# 그래서 target.name 과 secretKey 를 그 이름 그대로 맞춘다.
#
# ---------------------------------------------------------
# 이 시크릿을 읽는 것 — 세 파드다
# ---------------------------------------------------------
#   whatap-operator  : Deployment 가 secretKeyRef 로 직접 읽는다.
#                      optional 이 아니므로 없으면 파드가 기동조차 못 한다.
#   master-agent     : 오퍼레이터가 주입한다
#   node-agent       : 오퍼레이터가 주입한다
#
# 그래서 이 ExternalSecret 은 boa-whatap-operator Application(wave -15)
# 보다 먼저 와야 한다. 이 디렉터리를 담은 Application 이 wave -22 인 이유다.
#
# ---------------------------------------------------------
# 회전
# ---------------------------------------------------------
# refreshInterval 마다 Secrets Manager 를 다시 읽는다. 콘솔에서 액세스 키를
# 재발급하고 Secrets Manager 값만 갈아 주면 여기까지는 자동으로 따라온다.
# 다만 이미 떠 있는 파드의 환경변수는 갱신되지 않는다 — 에이전트 파드를
# 한 번 굴려야 새 값을 집는다(미확인 항목, 재발급 시 확인할 것).
# =========================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whatap-credentials
  namespace: whatap-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: boa-aws
    kind: ClusterSecretStore

  target:
    # 차트가 기대하는 고정 이름. 바꾸면 오퍼레이터가 못 찾는다.
    name: whatap-credentials

    # Owner — 이 ExternalSecret 이 Secret 의 주인이 된다. 지우면 같이 지워진다.
    creationPolicy: Owner

  data:
    # 쿠버네티스 제품 프로젝트(boa-aws-eks)의 액세스 키다.
    # 애플리케이션 제품 키(application_license)와 바꿔 넣으면 양쪽 다
    # 오류 없이 조용히 실패한다.
    - secretKey: WHATAP_LICENSE
      remoteRef:
        key: /boa/observability/whatap
        property: kubernetes_license

    - secretKey: WHATAP_HOST
      remoteRef:
        key: /boa/observability/whatap
        property: host

    - secretKey: WHATAP_PORT
      remoteRef:
        key: /boa/observability/whatap
        property: port
