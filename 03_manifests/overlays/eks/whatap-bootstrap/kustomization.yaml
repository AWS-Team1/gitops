# =========================================================
# 관측 스택 부트스트랩 — 다른 무엇보다 먼저 서야 하는 것들
#
# 이 디렉터리를 별도 Application(boa-whatap-bootstrap, wave -22)으로
# 빼는 이유는 순서 하나다. whatap-credentials 가 boa-whatap-operator(wave -15)
# 보다 먼저 있어야 하는데, 관측 Application 은 wave -5 라 너무 늦다.
# 그 사이의 Application 들은 전부 외부 Helm 차트라 우리 YAML 을 못 넣는다.
#
# monitoring 네임스페이스용 ExternalSecret 은 여기 없다. 그 네임스페이스는
# base/observability/namespace.yaml 이 만들고 관측 Application 에 속하므로,
# 그쪽 오버레이(observability/secrets.yaml)에 둔다.
# =========================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - clustersecretstore.yaml
  - externalsecret-whatap.yaml
