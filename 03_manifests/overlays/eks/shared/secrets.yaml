---
# 애플리케이션 Pod 전용 SecretProviderClass.
# 최소 권한 DB 자격 증명(/boa/database/app, role: bank_app)과 JWT 키만 참조한다.
# RDS master secret 은 여기 없으며, 앱 IAM Role 도 접근 권한이 없다.
# HARD-CODED: /boa Secret 이름과 RDS master ARN은 재사용 환경에 맞게 변경한다.
# objectName 은 같은 계정·리전이면 secret 이름만으로 참조 가능하므로 ARN 이 필요 없다.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bank-of-anthos-secrets
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "/boa/database/app"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: db-username
          - path: password
            objectAlias: db-password
      - objectName: "/boa/jwt/public"
        objectType: "secretsmanager"
        objectAlias: jwtRS256.key.pub
      - objectName: "/boa/jwt/private"
        objectType: "secretsmanager"
        objectAlias: jwtRS256.key
  secretObjects:
    - secretName: db-secret
      type: Opaque
      data:
        - objectName: db-username
          key: username
        - objectName: db-password
          key: password
---
# db-bootstrap Job 전용 SecretProviderClass. RDS master secret 을 참조하는 유일한 리소스.
# secretObjects 가 없으므로 Kubernetes Secret 으로 동기화되지 않고 Job Pod 안에 파일로만 마운트된다.
# secret VALUE 는 읽거나 출력·저장하지 않는다. master secret 이름은 boa-postgres 의 관리형 secret 이다.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bank-of-anthos-db-bootstrap-secrets
spec:
  provider: aws
  parameters:
    usePodIdentity: "true"
    objects: |
      - objectName: "arn:aws:secretsmanager:ap-northeast-2:769413326616:secret:rds!db-be74aa54-d52d-4aa0-8204-09d760618374-JMyH0s" # aws-render-runtime.sh로 갱신
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: master-username
          - path: password
            objectAlias: master-password
      - objectName: "/boa/database/app"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: app-username
          - path: password
            objectAlias: app-password
      - objectName: "/boa/database/accounts"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: accounts-username
          - path: password
            objectAlias: accounts-password
      - objectName: "/boa/database/ledger"
        objectType: "secretsmanager"
        jmesPath:
          - path: username
            objectAlias: ledger-username
          - path: password
            objectAlias: ledger-password

---
