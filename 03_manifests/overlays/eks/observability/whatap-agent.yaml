# =========================================================
# 와탭 쿠버네티스 에이전트 — WhatapAgent CR
#
# 이 파일이 없으면 whatap-operator 는 설치되지만 아무것도 하지 않는다.
# 오퍼레이터는 WhatapAgent CR 을 감시하다가 그것이 생겨야
# master-agent(Deployment)와 node-agent(DaemonSet)를 만든다.
#
# 만드는 경로 — 구성도의 경로 4
#   node-agent (노드마다) ─┐
#   master-agent          ─┴→ 와탭 쿠버네티스 제품 프로젝트
#
# 이 경로는 OpenTelemetry 와 무관하다. 수집기도 사이드카도 거치지 않고
# 에이전트가 직접 수집 서버로 보낸다. 그래서 OTel 이 전부 죽어도 살아 있다.
#
# ---------------------------------------------------------
# 자격증명 — whatap-credentials Secret 이 먼저 있어야 한다
# ---------------------------------------------------------
# 이 Secret 은 overlays/eks/whatap-bootstrap/externalsecret-whatap.yaml 이
# 만든다. External Secrets Operator 가 Secrets Manager 의
# /boa/observability/whatap 에서 값을 꺼내 이 네임스페이스에 쓴다.
#
# 2026-09-26 이전에는 사람이 kubectl create secret 으로 만들었다. 쿠버네티스
# Secret 이 네임스페이스를 넘지 못하는데 monitoring 쪽 CSI 경로를 여기서
# 쓸 수 없었기 때문이다. ESO 는 컨트롤러라 어느 네임스페이스에든 쓰므로
# 그 제약이 사라졌다. 수동 절차는 더 이상 없다.
#
# 읽는 쪽이 셋이다 — 오퍼레이터 Deployment(secretKeyRef, optional 아님),
# master-agent, node-agent. 그래서 이 Secret 은 오퍼레이터보다 앞 wave 에
# 만들어져야 한다(boa-whatap-bootstrap, wave -22).
#
# 라이선스 키가 Git 에 들어가지 않는다는 원칙은 그대로다. 저장소에 있는 것은
# "어느 필드를 어디로 옮겨라"는 지시뿐이고 값은 Secrets Manager 에만 있다.
# =========================================================
apiVersion: monitoring.whatap.com/v2alpha1
kind: WhatapAgent
metadata:
  name: whatap
  # namespace 를 적지 않는다 — 이 CR 은 scope: Cluster 다.
  # 적어도 API 서버가 무시하고, Argo CD 추적만 헷갈려진다.
  # 에이전트 파드는 오퍼레이터가 "자기 네임스페이스"에 만든다.
  annotations:
    # CRD 는 boa-whatap-operator Application(앱 단위 wave -15)이 설치한다.
    # 이 Application 은 wave -5 이므로 그보다 늦다. 앱 내부 wave 는
    # 수집기와 같은 10 을 쓴다 — 이 CR 은 monitoring 쪽 시크릿에 의존하지 않는다.
    argocd.argoproj.io/sync-wave: "10"
spec:
  # ---------------------------------------------------------
  # 2026-09-29 두 에이전트를 껐다 — 중복 수집 제거
  # ---------------------------------------------------------
  # 이 에이전트들이 모으던 것을 OpenTelemetry 가 이미 전부 모으고 있다.
  # 와탭 문서가 밝힌 수집 범위와 대조한 결과다.
  #
  #   컨테이너 CPU·Memory  → kubeletstats (metric_groups: node·pod·container)
  #   Disk(Volume)         → kubeletstats + hostmetrics.disk·filesystem
  #   Network              → hostmetrics.network
  #   Namespace·Deployment·ReplicaSet·Pod 등 → k8s_cluster
  #
  # 오히려 OTel 쪽이 넓다 — node_conditions_to_report 에 MemoryPressure·
  # DiskPressure·PIDPressure 가 있고, k8sobjects 가 type=Warning 이벤트
  # (OOMKilled·FailedScheduling)를 가져온다.
  #
  # 마스킹은 이 판단의 근거가 아니다. 이 에이전트가 보내던 것은 지표와
  # 오브젝트 상태뿐이라 민감정보가 들어갈 자리가 없고, 우리 게이트웨이도
  # metrics 파이프라인에는 마스킹을 걸지 않는다. 근거는 중복 제거와
  # 구성 단순화뿐이다.
  #
  # ---------------------------------------------------------
  # 대가 — 와탭 쿠버네티스 프로젝트 화면이 빈다
  # ---------------------------------------------------------
  # 이 화면을 채우던 것이 바로 이 두 에이전트다. OTel 이 보내는 k8s.* 지표는
  # whatap-otel 사이드카를 거쳐 *애플리케이션* 프로젝트로 가고, 그 데이터로
  # 쿠버네티스 화면이 그려지는지는 **확인되지 않았다.**
  # (와탭 OTel 문서는 애플리케이션 제품만 안내한다)
  #
  # 확인 방법은 exp/whatap-k8s-via-otel 브랜치와
  # docs/experiment-whatap-k8s-via-otel.md 에 있다. 되돌리려면 아래 두 값을
  # true 로 돌리거나 backup/dev-20260929 브랜치를 참조한다.
  features:
    k8sAgent:
      # 클러스터 단위 구성 정보를 모아 보낸다. 노드당이 아니라 클러스터당 하나다.
      masterAgent:
        enabled: false

      # 노드마다 뜨는 DaemonSet. 컨테이너 런타임 소켓을 읽어 파드·컨테이너
      # 지표를 만든다. 소켓 경로가 틀리면 파드는 Running 인데 지표가 비어 있다.
      nodeAgent:
        enabled: false

        # EKS AL2023 의 기본 런타임이다. 와탭 콘솔의 에이전트 설치 화면에서
        # 런타임을 고르면 아래 두 값이 자동으로 채워진다.
        runtime: containerd
        # runtimeSocketPath 는 차트 1.9.x 의 CRD 에만 있다. 1.7.6 CRD 에는 없어서
        # 적용해도 조용히 잘려 나간다(구조 스키마 pruning). Application 이
        # 1.9.11 을 고정하고 있으므로 이 값이 살아 있다.
        runtimeSocketPath: /var/run/containerd/containerd.sock

      # GPU 노드가 없다.
      gpuMonitoring:
        enabled: false

  # ---------------------------------------------------------
  # apm.instrumentation 은 켜지 않는다 — 의도적으로 비워 둔다
  # ---------------------------------------------------------
  # 와탭 오퍼레이터에도 자바·파이썬 자동계측 기능이 있다. 켜면 같은 파드에
  # 자바 에이전트가 둘 붙고 JAVA_TOOL_OPTIONS 가 충돌해 앱이 기동하지 못한다.
  #
  # 이 설계는 계측을 OpenTelemetry 로 통일한다(base/observability/instrumentation.yaml).
  # 그래야 목적지를 바꿀 때 수집기의 exporter 블록만 교체하면 된다.
  #
  # 같은 함정이 와탭 콘솔에도 있다 — 관리 > 에이전트 설치 화면의
  # "APM 자동 설치" 체크박스가 이 필드다. 반드시 끈 상태로 파일을 받는다.
