# =========================================================
# 시크릿 공급 — External Secrets Operator
#
# 흐름 —
#   Secrets Manager /boa/observability/*
#     → ClusterSecretStore boa-aws (overlays/eks/whatap-bootstrap/)
#       → 이 파일의 ExternalSecret
#         → 쿠버네티스 Secret
#           → 수집기 · Grafana 가 env 로 읽음
#
# ---------------------------------------------------------
# 2026-09-26 이전 구조와 무엇이 달라졌나
# ---------------------------------------------------------
# 전에는 Secrets Store CSI 드라이버를 썼다. CSI 는 컨트롤러가 아니라
# 볼륨 플러그인이라, "누군가 볼륨을 마운트할 때"만 Secrets Manager 를 읽는다.
# 그런데 수집기와 Grafana 는 볼륨을 쓰지 않고 secretKeyRef 로 env 만 읽는다.
# 아무도 마운트하지 않으면 Secret 이 영영 생기지 않는다.
#
# 그래서 아무 일도 하지 않고 볼륨만 들고 있는 파드(observability-secret-sync)
# 를 일부러 띄워 뒀었다. 그 파드가 죽으면 Secret 이 갱신되지 않았고,
# 네임스페이스마다 Pod Identity 연결이 필요해 whatap-monitoring 은 아예
# 자동화하지 못했다.
#
# ESO 는 컨트롤러다. 마운트 개념이 없으므로 그 파드가 필요 없고, 한 컨트롤러가
# 어느 네임스페이스에든 Secret 을 쓴다.
#
# 앱 쪽(overlays/eks/shared/)은 CSI 를 그대로 쓴다. 앱 파드는 자기가 직접
# CSI 볼륨을 마운트하고 있어 사정이 다르고, 이번 범위는 관측 스택만이다.
# 두 방식은 컨트롤러도 CR 도 Secret 이름도 겹치지 않아 공존에 문제가 없다.
# =========================================================
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: whatap-observability
  namespace: monitoring
  annotations:
    # 수집기(wave 10) 보다 먼저. 예전 SecretProviderClass 가 쓰던 자리와 같다.
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: boa-aws
    kind: ClusterSecretStore

  target:
    name: whatap-observability
    creationPolicy: Owner

  data:
    # 사이드카(whatap-otel)의 WHATAP_ACCESSKEY 가 된다.
    # 애플리케이션 제품 프로젝트(boa-apm)의 키다.
    - secretKey: application_license
      remoteRef:
        key: /boa/observability/whatap
        property: application_license

    # 사이드카의 WHATAP_SERVER_HOST. IP 두 개를 슬래시로 이은 형식이다.
    - secretKey: host
      remoteRef:
        key: /boa/observability/whatap
        property: host

    # 수집 서버 포트(6600). 사이드카가 "받는" 포트(6601)와 다르다 —
    # collector-gateway.yaml 의 WHATAP_OTEL_GRPC_SERVER_PORT 주석 참조.
    - secretKey: port
      remoteRef:
        key: /boa/observability/whatap
        property: port

    # ---------------------------------------------------------
    # 실험용 — 쿠버네티스 제품 키를 monitoring 에도 둔다
    # ---------------------------------------------------------
    # 원래 이 키는 여기 없었다. 그것을 읽는 에이전트(master/node-agent)가
    # whatap-monitoring 에 있고 쿠버네티스 Secret 은 네임스페이스를 넘지 못해서,
    # whatap-bootstrap/externalsecret-whatap.yaml 이 그쪽에 따로 만든다.
    #
    # 그런데 실험에서는 monitoring 의 게이트웨이 파드에 붙는 두 번째 사이드카가
    # 이 키로 쿠버네티스 프로젝트에 접속한다. 그래서 같은 값이 두 네임스페이스에
    # 각각 동기화된다 — 중복이지만 ExternalSecret 이 양쪽을 알아서 맞춘다.
    #
    # 실험이 실패로 끝나면(= 와탭 k8s 화면이 안 채워지면) 이 항목을 지운다.
    - secretKey: kubernetes_license
      remoteRef:
        key: /boa/observability/whatap
        property: kubernetes_license
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: boa-aws
    kind: ClusterSecretStore

  target:
    name: grafana-admin
    creationPolicy: Owner

  data:
    - secretKey: admin_user
      remoteRef:
        key: /boa/observability/grafana
        property: admin_user

    - secretKey: admin_password
      remoteRef:
        key: /boa/observability/grafana
        property: admin_password
