# =========================================================
# 시크릿 공급 — Secrets Store CSI + Secrets Manager
#
# 와탭 라이선스 키와 Grafana 관리자 비밀번호는 Git 에 들어가지 않는다.
# 앱 쪽(overlays/eks/shared/secret-sync.yaml)과 같은 방식을 쓴다 —
# 클러스터에 이미 aws-secrets-store-csi-driver-provider 애드온이 있다.
#
# 값을 채우는 명령은 Infra/aws-observability 의 secret_fill_commands 출력에 있다.
# Terraform 은 껍데기만 만들고 값은 넣지 않는다.
#
# 흐름 —
#   Secrets Manager /boa/observability/*
#     → SecretProviderClass (이 파일)
#       → secretObjects 로 쿠버네티스 Secret 동기화
#         → 수집기·Grafana 파드가 env 로 읽음
#
# 주의 — secretObjects 로 동기화된 Secret 은 "그 SecretProviderClass 를 볼륨으로
# 마운트한 파드가 하나라도 뜬 뒤에" 만들어진다. 그래서 아래 sync-pod 가 필요하다.
# 수집기는 볼륨을 마운트하지 않고 env 로만 읽으므로, 마운트하는 파드가 따로 있어야 한다.
# =========================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: observability-secrets
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  provider: aws

  parameters:
    objects: |
      - objectName: "/boa/observability/whatap"
        objectType: "secretsmanager"
        jmesPath:
          - path: "kubernetes_license"
            objectAlias: "whatap_kubernetes_license"
          - path: "application_license"
            objectAlias: "whatap_application_license"
          - path: "host"
            objectAlias: "whatap_host"
          - path: "port"
            objectAlias: "whatap_port"
      - objectName: "/boa/observability/grafana"
        objectType: "secretsmanager"
        jmesPath:
          - path: "admin_user"
            objectAlias: "grafana_admin_user"
          - path: "admin_password"
            objectAlias: "grafana_admin_password"

  secretObjects:
    - secretName: whatap-observability
      type: Opaque
      data:
        - objectName: whatap_kubernetes_license
          key: kubernetes_license
        - objectName: whatap_application_license
          key: application_license
        - objectName: whatap_host
          key: host
        - objectName: whatap_port
          key: port

    - secretName: grafana-admin
      type: Opaque
      data:
        - objectName: grafana_admin_user
          key: admin_user
        - objectName: grafana_admin_password
          key: admin_password
---
# secretObjects 를 실제로 만들어 내는 최소 파드.
#
# CSI 드라이버는 "볼륨이 마운트될 때" Secrets Manager 를 읽고 Secret 을 만든다.
# 수집기와 Grafana 는 env(secretKeyRef)로만 읽으므로 아무도 마운트하지 않으면
# Secret 이 영원히 생기지 않고 두 파드가 CreateContainerConfigError 로 멈춘다.
#
# 이 Deployment 가 그 마운트를 담당한다. 하는 일은 없고 볼륨만 들고 있는다.
# replicas 1 · 리소스 최소 — 이 파드가 죽으면 Secret 이 갱신되지 않으므로
# 살아 있어야 한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-secret-sync
  namespace: monitoring
  annotations:
    # 수집기(wave 10)보다 먼저 떠서 Secret 을 만들어 두어야 한다.
    argocd.argoproj.io/sync-wave: "7"
  labels:
    app: observability-secret-sync
spec:
  replicas: 1

  selector:
    matchLabels:
      app: observability-secret-sync

  template:
    metadata:
      labels:
        app: observability-secret-sync
    spec:
      # Pod Identity 로 Secrets Manager 를 읽을 권한이 필요하다.
      # 수집기와 같은 역할을 쓴다 — /boa/observability* 로 범위가 좁혀져 있다.
      serviceAccountName: otel-collector

      containers:
        - name: pause
          image: public.ecr.aws/eks-distro/kubernetes/pause:3.9

          volumeMounts:
            - name: secrets
              mountPath: /mnt/observability
              readOnly: true

          resources:
            limits:
              cpu: 20m
              memory: 32Mi
            requests:
              cpu: 10m
              memory: 16Mi

      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true

            volumeAttributes:
              secretProviderClass: observability-secrets
