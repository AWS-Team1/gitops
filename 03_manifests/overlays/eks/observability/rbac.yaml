# =========================================================
# 수집기 ServiceAccount 와 RBAC
#
# 이름이 Infra 와 묶여 있다 — Infra/aws-observability 의
# collector_service_account = "otel-collector" 와 정확히 같아야 한다.
# 틀리면 Pod Identity 가 붙지 않고, 수집기는 뜨지만 AWS exporter 만
# NoCredentialProviders 로 실패한다. 파드는 Running 이라 눈치채기 어렵다.
#
# 오퍼레이터가 SA 를 자동 생성하기도 하지만, 여기서 명시적으로 만든다 —
# Pod Identity 연결 대상이 Terraform 에 하드코딩돼 있으므로 이름이 우연에
# 맡겨져서는 안 된다.
# =========================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: monitoring
  annotations:
    # 수집기 CR(wave 10) 보다 먼저 있어야 한다.
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: observability
---
# k8sattributes · k8s_cluster · k8sobjects 세 컴포넌트가 요구하는 권한이다.
# 전부 읽기 전용이다 — 수집기가 클러스터를 바꿀 이유는 없다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "5"
rules:
  # k8sattributes 가 파드 IP → 메타데이터를 해석하는 데 쓴다.
  # namespaces 가 없으면 네임스페이스 레이블을 못 붙인다.
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - nodes
      - nodes/proxy   # kubeletstats 가 :10250 에 붙는 경로
      - services
      - endpoints
      - replicationcontrollers
      - resourcequotas
      - persistentvolumes
      - persistentvolumeclaims
    verbs: [get, list, watch]

  # kubeletstats 가 노드 지표를 읽는다. nodes/proxy 와 별개로 필요하다.
  - apiGroups: [""]
    resources: [nodes/stats, nodes/metrics]
    verbs: [get, list, watch]

  # k8s_cluster 가 워크로드 상태를 센다.
  - apiGroups: ["apps"]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]

  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]

  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]

  # k8sobjects 가 경고 이벤트를 감시한다.
  - apiGroups: ["events.k8s.io"]
    resources: [events]
    verbs: [get, list, watch]

  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]

  # k8sattributes 가 자기 권한을 확인하는 데 쓴다. 없으면 기동 시 경고가 뜬다.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: monitoring
---
# Grafana 의 SA. Pod Identity 로 CloudWatch 읽기 역할을 받는다.
# 클러스터 리소스를 읽을 필요가 없어 ClusterRole 이 없다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: observability
