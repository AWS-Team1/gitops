# =========================================================
# ClusterSecretStore — 어느 금고를 어떤 자격으로 읽을지
#
# ExternalSecret 은 "무엇을 어디로"만 적고, "어떻게 읽을지"는 여기에 둔다.
# 네임스페이스마다 SecretStore 를 두는 방법도 있지만, 그러면 네임스페이스마다
# Pod Identity 연결이 다시 필요해진다 — 지금 whatap-monitoring 이 수동인
# 바로 그 이유다. 클러스터 단위로 하나만 둔다.
#
# ---------------------------------------------------------
# 자격증명 — auth 블록을 일부러 비운다
# ---------------------------------------------------------
# auth 를 적지 않으면 컨트롤러 파드의 기본 자격증명 사슬을 쓴다. EKS Pod
# Identity 에이전트가 파드에 자격증명을 주입하므로 그대로 잡힌다.
# 연결 대상은 ns external-secrets · sa external-secrets 이고,
# Terraform(aws-modules/observability)에서 만든다.
#
# auth.secretRef 로 액세스 키를 넣는 방법도 있지만 쓰지 않는다 —
# 그러면 "시크릿을 읽기 위한 시크릿"이 생겨 문제가 원점으로 돌아간다.
#
# ---------------------------------------------------------
# conditions — 이 금고를 참조할 수 있는 네임스페이스를 못 박는다
# ---------------------------------------------------------
# ClusterSecretStore 는 기본적으로 모든 네임스페이스가 참조할 수 있다.
# 그대로 두면 아무 네임스페이스에서나 ExternalSecret 하나 만들어
# /boa/observability/* 를 꺼내 갈 수 있다. 두 곳으로 제한한다.
#
# IAM 정책 자체도 secret:/boa/observability* 로 좁혀져 있어 앱 DB 자격증명
# 같은 것은 애초에 읽히지 않는다. 두 겹이다.
# =========================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: boa-aws
  annotations:
    # 네임스페이스(wave 0) 다음, ExternalSecret(wave 2) 보다 먼저.
    argocd.argoproj.io/sync-wave: "1"
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2

  conditions:
    - namespaces:
        - monitoring
        - whatap-monitoring
