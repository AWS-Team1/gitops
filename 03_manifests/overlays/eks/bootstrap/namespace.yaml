# =========================================================
# whatap-monitoring 네임스페이스
#
# 여기서 명시적으로 만드는 이유 두 가지다.
#
#   1. 순서 — 이 네임스페이스에 들어갈 ExternalSecret(같은 디렉터리)이
#      네임스페이스보다 먼저 적용되면 실패한다. boa-whatap-operator
#      Application 의 CreateNamespace=true 는 wave -15 라 그보다 늦다.
#
#   2. PSA(파드 보안 어드미션) 라벨을 붙이기 위해서다. CreateNamespace 로
#      자동 생성되는 네임스페이스에는 라벨을 달 수 없다.
#
# PSA 는 네임스페이스 단위로만 걸린다. 파드 하나만 예외로 열어 줄 수 없다.
# ---------------------------------------------------------
# 왜 privileged 인가
# ---------------------------------------------------------
# node-agent 가 컨테이너 런타임 소켓을 hostPath 로 마운트한다.
# baseline 수준은 hostPath 볼륨을 금지하므로 이 네임스페이스는 통과하지 못한다.
#
# 그래서 enforce 는 열어 두되 audit 을 baseline 으로 걸어, "지금 알고 있는
# 그 파드 말고 다른 것이 baseline 을 어기면 감사 로그에 남게" 한다.
# 열어 둔 것이 의도된 예외임을 코드로 남기는 것이 이 라벨의 목적이다.
# =========================================================
apiVersion: v1
kind: Namespace
metadata:
  name: whatap-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    kubernetes.io/metadata.name: whatap-monitoring
    app.kubernetes.io/part-of: observability

    # 의도된 예외 — node-agent 의 hostPath 때문이다.
    pod-security.kubernetes.io/enforce: privileged

    # 감사만 한다. 막지 않는다.
    pod-security.kubernetes.io/audit: baseline
