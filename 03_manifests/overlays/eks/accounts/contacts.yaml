apiVersion: apps/v1
kind: Deployment
metadata:
  name: contacts
spec:
  template:
    spec:
      containers:
        - name: contacts
          image: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/boa-contacts:sha-5a6c6f1617734175db508672028e880b044571d6
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: accounts-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: accounts-db-secret
                  key: password
            - name: ACCOUNTS_DB_URI
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db.boa.internal:5432/accountsdb?sslmode=require"
            - name: VALKEY_HOST
              valueFrom:
                secretKeyRef:
                  name: valkey-secret
                  key: host
            - name: VALKEY_PORT
              value: "6379"
            - name: VALKEY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: valkey-secret
                  key: username
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-secret
                  key: password
            - name: VALKEY_TLS
              value: "true"
            - name: VALKEY_CLUSTER_MODE
              value: "true"
      volumes:
        - $patch: replace
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: bank-of-anthos-accounts-secrets