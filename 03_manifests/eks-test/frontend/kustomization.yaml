apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bank-of-anthos
resources:
  - ../../base/frontend
  - ingress.yaml
patches:
  - path: frontend.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: frontend-networkpolicy
    patch: |-
      - op: replace
        path: /spec/ingress/0/from
        value:
          - ipBlock:
              cidr: 10.0.2.0/24
          - ipBlock:
              cidr: 10.0.3.0/24
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: frontend-networkpolicy
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock:
                cidr: 10.0.24.0/24
            - ipBlock:
                cidr: 10.0.25.0/24
          ports:
            - port: 6379
              protocol: TCP
