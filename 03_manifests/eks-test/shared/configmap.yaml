# db-bootstrap Job 이 읽는 비밀 아닌 환경값.
# 테스트 애플리케이션은 db.test.boa.internal을 사용한다.
# HARD-CODED: DB 이름/포트/내부 DNS는 재사용 환경에 맞게 변경한다.
# DB endpoint 는 raw RDS 주소 대신 안정적인 내부 DNS(db.test.boa.internal)를 쓴다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-of-anthos-env
data:
  DB_HOST: db.test.boa.internal
  DB_PORT: "5432"
  DB_NAME: boadb
  VALKEY_HOST: REPLACE_WITH_ELASTICACHE_ENDPOINT
  VALKEY_PORT: "6379"
