apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
        - name: frontend
          image: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/boa-frontend:sha-6189ddaa5aae2a2a9d15c1ddca53fe2aea45553f
          env:
            - name: ENV_PLATFORM
              value: "aws"
      volumes:
        - $patch: replace
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: bank-of-anthos-secrets
