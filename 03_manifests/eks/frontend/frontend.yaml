apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
        - name: frontend
          image: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/boa-frontend:sha-c8925a18c714725c972d644c1909da7e7907afda
          env:
            - name: ENV_PLATFORM
              value: "aws"
            - name: CLUSTER_NAME
              value: "boa-eks"
      volumes:
        - $patch: replace
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: bank-of-anthos-secrets
