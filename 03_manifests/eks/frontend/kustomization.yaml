apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bank-of-anthos
resources:
  - ../../base/frontend
  - ingress.yaml
patches:
  - path: frontend.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: frontend-networkpolicy
    patch: |-
      - op: replace
        path: /spec/ingress/0/from
        value:
          - ipBlock:
              cidr: 192.168.2.0/24
          - ipBlock:
              cidr: 192.168.3.0/24
