apiVersion: apps/v1
kind: Deployment
metadata:
  name: contacts
spec:
  template:
    spec:
      containers:
        - name: contacts
          image: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/boa-contacts:sha-85bcbdb946add2593f2c19e720b42acbbc9ee3a3
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: accounts-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: accounts-db-secret
                  key: password
            - name: ACCOUNTS_DB_URI
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db.boa.internal:5432/accountsdb"
            - name: VALKEY_HOST
              valueFrom: {configMapKeyRef: {name: bank-of-anthos-env, key: VALKEY_HOST}}
            - name: VALKEY_PORT
              valueFrom: {configMapKeyRef: {name: bank-of-anthos-env, key: VALKEY_PORT}}
            - name: VALKEY_USERNAME
              valueFrom: {secretKeyRef: {name: valkey-secret, key: username}}
            - name: VALKEY_PASSWORD
              valueFrom: {secretKeyRef: {name: valkey-secret, key: password}}
            - name: VALKEY_TLS
              value: "true"
            - name: CONTACTS_CACHE_TTL_SECONDS
              value: "600"
            - name: CONTACTS_CACHE_JITTER_SECONDS
              value: "60"
      volumes:
        - $patch: replace
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: bank-of-anthos-accounts-secrets
