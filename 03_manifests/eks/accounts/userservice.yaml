apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
spec:
  template:
    spec:
      containers:
        - name: userservice
          image: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/boa-userservice:sha-8c627b15d0b6481879a560a7bfddf265d148420c
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: accounts-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: accounts-db-secret
                  key: password
            - name: ACCOUNTS_DB_URI
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db.boa.internal:5432/accountsdb"
      volumes:
        - $patch: replace
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: bank-of-anthos-accounts-secrets
