apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bank-of-anthos
resources:
  - ../../base/ledger
patches:
  - path: balancereader.yaml
  - path: ledgerwriter.yaml
  - path: transactionhistory.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: balancereader-networkpolicy
    patch: &rds-egress |-
      - op: replace
        path: /spec/egress/0/to
        value:
          - ipBlock:
              cidr: 192.168.16.0/24
          - ipBlock:
              cidr: 192.168.17.0/24
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: ledgerwriter-networkpolicy
    patch: *rds-egress
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: transactionhistory-networkpolicy
    patch: *rds-egress
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: balancereader-networkpolicy
    patch: &valkey-egress |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock:
                cidr: 192.168.24.0/24
            - ipBlock:
                cidr: 192.168.25.0/24
          ports:
            - port: 6379
              protocol: TCP
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: ledgerwriter-networkpolicy
    patch: *valkey-egress
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: transactionhistory-networkpolicy
    patch: *valkey-egress
