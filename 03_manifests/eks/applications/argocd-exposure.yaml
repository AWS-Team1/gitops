apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boa-argocd-exposure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-25"
spec:
  project: default
  # HARD-CODED: 재사용할 GitHub 조직/저장소/브랜치에 맞게 변경한다.
  source:
    repoURL: https://github.com/AWS-TEAM1-DEV/gitops.git
    targetRevision: jiho-test-cd
    path: 03_manifests/eks/argocd-exposure
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
