apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boa-shared
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: boa
  source:
    repoURL: https://github.com/AWS-TEAM1-DEV/gitops.git
    targetRevision: jiho-test-cd
    path: 03_manifests/eks/shared
  destination:
    server: https://kubernetes.default.svc
    namespace: bank-of-anthos
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
