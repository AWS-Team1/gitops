---
# Source: bank-of-anthos/templates/transactionhistory/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transactionhistory
spec:
  selector:
    matchLabels:
      app: transactionhistory
  template:
    metadata:
      labels:
        app: transactionhistory
      annotations:
        # OpenTelemetry 오퍼레이터의 변경 웹훅이 이 값을 읽어 자바 에이전트를 주입한다.
        # 값은 <Instrumentation 네임스페이스>/<이름>. base 에 두면 EKS·GKE 양쪽에 적용된다.
        instrumentation.opentelemetry.io/inject-java: "bank-of-anthos/boa"
    spec:
      serviceAccountName: bank-of-anthos
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: transactionhistory
              topologyKey: kubernetes.io/hostname
      containers:
        - name: transactionhistory
          image: boa-transactionhistory:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: VERSION
              value: "1.0"
            - name: PORT
              value: "8080"
            - name: ENABLE_TRACING
              value: "false"
            - name: POLL_MS
              value: "100"
            - name: CACHE_SIZE
              value: "1000000"
            - name: HISTORY_LIMIT
              value: "100"
            - name: LOCAL_ROUTING_NUM
              value: "883745000"
            - name: PUB_KEY_PATH
              value: /tmp/.ssh/jwtRS256.key.pub
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "3"
          volumeMounts:
            - name: secrets-store
              mountPath: /tmp/.ssh
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: secrets-store
          emptyDir: {}
---
# Source: bank-of-anthos/templates/transactionhistory/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: transactionhistory
spec:
  selector:
    app: transactionhistory
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
# Source: bank-of-anthos/templates/transactionhistory/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: transactionhistory-networkpolicy
spec:
  podSelector:
    matchLabels:
      app: transactionhistory
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 8080
  egress:
    # Platform overlay replaces the database destination.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/32
      ports:
        - port: 5432
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
