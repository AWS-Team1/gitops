---
# Source: bank-of-anthos/templates/contacts/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contacts
spec:
  selector:
    matchLabels:
      app: contacts
  template:
    metadata:
      labels:
        app: contacts
      annotations:
        # opentelemetry-instrument 래퍼가 주입된다. 앱 소스·이미지는 바뀌지 않는다.
        # gunicorn 프리포크와의 호환은 검증 대상이다(변경 내역 미결 항목 참조).
        instrumentation.opentelemetry.io/inject-python: "bank-of-anthos/boa"
    spec:
      serviceAccountName: bank-of-anthos
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: contacts
              topologyKey: kubernetes.io/hostname
      containers:
        - name: contacts
          image: boa-contacts:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: VERSION
              value: "1.0"
            - name: PORT
              value: "8080"
            - name: ENABLE_TRACING
              value: "false"
            - name: LOG_LEVEL
              value: "info"
            - name: PUB_KEY_PATH
              value: /tmp/.ssh/jwtRS256.key.pub
          volumeMounts:
            - name: secrets-store
              mountPath: /tmp/.ssh
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: secrets-store
          emptyDir: {}
---
# Source: bank-of-anthos/templates/contacts/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: contacts
spec:
  selector:
    app: contacts
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
# Source: bank-of-anthos/templates/contacts/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: contacts-networkpolicy
spec:
  podSelector:
    matchLabels:
      app: contacts
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 8080
  egress:
    # Platform overlay replaces the database destination.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/32
      ports:
        - port: 5432
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
