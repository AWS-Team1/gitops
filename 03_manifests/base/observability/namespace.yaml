# 관측 스택 전용 네임스페이스.
#
# 이름이 세 곳과 묶여 있다 — 하나라도 어긋나면 조용히 실패한다.
#   1. Infra/aws-observability 의 observability_namespace (Pod Identity 연결 대상)
#   2. overlays/*/shared/networkpolicy-observability.yaml 의 namespaceSelector
#   3. Instrumentation CR 의 exporter endpoint 호스트명
#
# default-deny 는 걸지 않는다. bank-of-anthos 와 달리 이 네임스페이스는 외부로
# 나가는 것이 일(와탭 · CloudWatch · S3)이고, 막으면 전부 끊긴다.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # kubernetes.io/metadata.name 은 쿠버네티스가 자동으로 붙이지만,
    # 명시해 두면 kustomize 렌더 결과만 보고도 selector 대상을 확인할 수 있다.
    kubernetes.io/metadata.name: monitoring
    app.kubernetes.io/part-of: observability

    # -------------------------------------------------------
    # PSA(파드 보안 어드미션) — 네임스페이스 단위로만 걸린다
    # -------------------------------------------------------
    # privileged 인 이유는 otel-agent 하나 때문이다. DaemonSet 이 컨테이너
    # 로그를 읽으려고 /var/log/pods 와 /var/lib/docker/containers 를
    # hostPath 로 마운트한다(collector-agent.yaml). baseline 수준은 hostPath
    # 볼륨을 금지하므로 이 네임스페이스는 baseline 을 통과하지 못한다.
    #
    # 나머지 파드(게이트웨이 · 클러스터 수집기 · Grafana)는 호스트에 닿지
    # 않는다. 그래서 audit 을 baseline 으로 걸어, 그 셋 중 하나라도 baseline
    # 을 어기기 시작하면 감사 로그에 남게 한다. 막지는 않는다.
    #
    # EKS 와 GKE 양쪽 다 같은 hostPath 를 쓰므로 이 라벨은 base 에 둔다.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
  annotations:
    # cert-manager(wave 0) · 오퍼레이터(wave 5) 보다 먼저 만들어져야 한다.
    argocd.argoproj.io/sync-wave: "-10"
