apiVersion: v1
kind: Service
metadata:
  name: ledgerwriter
  labels:
    app: ledgerwriter
    app.kubernetes.io/name: ledgerwriter
    app.kubernetes.io/part-of: bank-app
spec:
  type: ClusterIP
  selector:
    app: ledgerwriter
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerwriter
  labels:
    app: ledgerwriter
    app.kubernetes.io/name: ledgerwriter
    app.kubernetes.io/part-of: bank-app
spec:
  selector:
    matchLabels:
      app: ledgerwriter
  template:
    metadata:
      labels:
        app: ledgerwriter
        app.kubernetes.io/name: ledgerwriter
        app.kubernetes.io/part-of: bank-app
    spec:
      serviceAccountName: bank-of-anthos
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: ledgerwriter
              topologyKey: kubernetes.io/hostname
      containers:
        - name: ledgerwriter
          image: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/ledgerwriter:v0.6.10
          ports:
            - containerPort: 8080
              protocol: TCP
          env:
            - name: VERSION
              value: "1.0"
            - name: PORT
              value: "8080"
            - name: ENABLE_TRACING
              value: "false"
            - name: LOCAL_ROUTING_NUM
              value: "883745000"
            - name: PUB_KEY_PATH
              value: /tmp/.ssh/jwtRS256.key.pub
            - name: BALANCES_API_ADDR
              value: balancereader:8080
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: bank-of-anthos-env
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: bank-of-anthos-env
                  key: DB_PORT
            - name: LEDGER_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: bank-of-anthos-env
                  key: LEDGER_DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: password
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://$(DB_HOST):$(DB_PORT)/$(LEDGER_DB_NAME)
            - name: SPRING_DATASOURCE_USERNAME
              value: $(POSTGRES_USER)
            - name: SPRING_DATASOURCE_PASSWORD
              value: $(POSTGRES_PASSWORD)
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets-store
              mountPath: /tmp/.ssh
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: bank-of-anthos-secrets
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ledgerwriter-hpa
  labels:
    app: ledgerwriter
    app.kubernetes.io/name: ledgerwriter
    app.kubernetes.io/part-of: bank-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ledgerwriter
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
