# 애플리케이션 Pod 전용 ServiceAccount.
# Pod Identity 로 bank-of-anthos-app IAM Role 에 매핑되며,
# 이 Role 은 JWT 키와 /project/database/app 만 읽을 수 있다.
# RDS master secret 접근 권한은 없다 (infra/app-identity.tf).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bank-of-anthos
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
