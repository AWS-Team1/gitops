apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bank-of-anthos
resources:
  - ../../../base
  - namespace.yaml
  - secretproviderclass.yaml
  - secretproviderclass-db-bootstrap.yaml
components:
  - ../../../components/aws
labels:
  - pairs:
      environment: dev
      platform: aws
    includeTemplates: true
# DB endpoint / 논리 DB 이름은 Terraform output에서 렌더링된다.
# generator를 쓰므로 값이 바뀌면 ConfigMap 이름 해시가 바뀌고 Pod가 자동으로 롤링된다.
configMapGenerator:
  - name: bank-of-anthos-env
    envs:
      - env-config.properties
# images[].newName 의 레지스트리 호스트는 bootstrap-eks.sh 가
# terraform output ecr_registry 로 갱신한다.
# CI는 images[].newTag 만 sha-<commit> 형식으로 교체한다.
images:
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/frontend
    newName: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/frontend
    newTag: sha-e995e5fcb51434fc33a8a0bf84f212136332b5d1
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/userservice
    newName: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/userservice
    newTag: sha-724df55c13e262d2fdd2a0c56cdd243fee74dd15
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/contacts
    newName: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/contacts
    newTag: sha-724df55c13e262d2fdd2a0c56cdd243fee74dd15
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/balancereader
    newName: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/balancereader
    newTag: sha-724df55c13e262d2fdd2a0c56cdd243fee74dd15
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/ledgerwriter
    newName: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/ledgerwriter
    newTag: sha-724df55c13e262d2fdd2a0c56cdd243fee74dd15
  - name: us-central1-docker.pkg.dev/bank-of-anthos-ci/bank-of-anthos/transactionhistory
    newName: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/transactionhistory
    newTag: sha-724df55c13e262d2fdd2a0c56cdd243fee74dd15

# db-bootstrap Job 은 Sync hook + sync-wave -2 라 wave 0 리소스보다 먼저 돈다.
# 생성된 ConfigMap 2개가 wave 0 이면 Job 이 마운트할 때 아직 없어서
# ContainerCreating 에서 멈추고 sync 전체가 hook 대기로 블록된다.
# annotation 은 name 해시에 들어가지 않으므로 해시는 그대로다.
patches:
  - target:
      kind: ConfigMap
      name: bank-of-anthos-env
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: bank-of-anthos-env
        annotations:
          argocd.argoproj.io/sync-wave: "-3"
  - target:
      kind: ConfigMap
      name: db-bootstrap-sql
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: db-bootstrap-sql
        annotations:
          argocd.argoproj.io/sync-wave: "-3"
