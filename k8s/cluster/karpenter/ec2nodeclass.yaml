apiVersion: karpenter.k8s.aws/v1         # Karpenter AWS 전용 API 그룹
kind: EC2NodeClass                        # EC2 노드의 하드웨어/네트워크 설정 정의
metadata:
  name: default                           # nodepool.yaml의 nodeClassRef.name과 반드시 일치해야 함
spec:
  amiSelectorTerms:
    - alias: al2023@latest                # Amazon Linux 2023 최신 버전 자동 선택 (보안 패치 포함)
  role: project-eks-karpenter-node-role   # Karpenter가 생성한 노드에 부여할 IAM 역할 (Terraform으로 생성 필요)
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: project-eks  # 이 태그가 붙은 서브넷에만 노드 생성 (Terraform에서 태그 추가 필요)
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: project-eks  # 이 태그가 붙은 보안그룹을 노드에 적용 (Terraform에서 태그 추가 필요)
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi                  # 기본 20Gi → 50Gi (이미지, 로그 누적 고려)
        volumeType: gp3                   # gp2보다 성능 좋고 20% 저렴
        encrypted: true                   # EBS 볼륨 암호화 (은행 앱 필수 - 디스크 탈취 시 데이터 보호)
  tags:
    project: project-eks                  # Karpenter가 생성한 EC2에 붙는 태그 (비용 추적, 리소스 식별용)
