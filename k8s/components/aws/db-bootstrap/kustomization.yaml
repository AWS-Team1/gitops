apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# db-bootstrap: RDS master 자격 증명을 쓰는 유일한 워크로드.
# 환경 종속 값(ARN)은 여기 없다. SecretProviderClass 는 overlay 에서 렌더링된다.
resources:
  - serviceaccount.yaml
  - networkpolicy.yaml
  - job.yaml
configMapGenerator:
  - name: db-bootstrap-sql
    files:
      - sql/0-accounts-schema.sql
      - sql/0_init_tables.sql
