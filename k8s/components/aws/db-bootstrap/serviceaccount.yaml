# db-bootstrap 전용 ServiceAccount.
#
# 애플리케이션 SA(bank-of-anthos)와 분리되어 있고, Pod Identity 로 서로 다른
# IAM Role 에 매핑된다 (infra/app-identity.tf).
#   bank-of-anthos-db-bootstrap -> RDS master secret + 앱 secret
#   bank-of-anthos              -> 앱 secret + JWT 키만
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bank-of-anthos-db-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
