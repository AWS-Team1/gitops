# default-deny-all 아래에서도 db-bootstrap Pod 가 RDS 와 DNS 로 나갈 수 있게 한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-bootstrap-networkpolicy
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  podSelector:
    matchLabels:
      app: db-bootstrap
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - port: 5432
          protocol: TCP
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
