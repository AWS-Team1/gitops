name: Build Argo deployer image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: boa-argo-deployer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Inspect actual OIDC claims
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              + "&audience=sts.amazonaws.com",
              headers={
                  "Authorization": "Bearer "
                  + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )

          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print(json.dumps({
              "sub": claims.get("sub"),
              "aud": claims.get("aud"),
              "repository": claims.get("repository"),
              "ref": claims.get("ref"),
              "environment": claims.get("environment"),
          }, indent=2))
          PY

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::769413326616:role/boa-github-argo-workflows-deploy-dev
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and push by digest
        shell: bash
        run: |
          set -Eeuo pipefail
          tag="run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$ECR_REGISTRY"

          docker build \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$tag" \
            tools/argo-deployer
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$tag"

          digest="$(aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$tag" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          test "${digest#sha256:}" != "$digest"
          echo "Use: $ECR_REGISTRY/$ECR_REPOSITORY@$digest" >> "$GITHUB_STEP_SUMMARY"
