apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: argocd-server
  namespace: argocd
spec:
  serviceRef:
    name: argocd-server
    port: http
  targetGroupARN: arn:aws:elasticloadbalancing:ap-northeast-2:769413326616:targetgroup/boa-argocd-tg/79478ca3068e7cbf # aws-render-runtime.sh로 갱신
  targetType: ip
  networking:
    ingress:
      - from:
          - securityGroup:
              groupID: sg-0e4b3718e6b209525 # aws-render-runtime.sh로 갱신
        ports:
          - protocol: TCP
            port: 8080
