apiVersion: elbv2.k8s.aws/v1beta1
kind: TargetGroupBinding
metadata:
  name: argocd-server
  namespace: argocd
spec:
  serviceRef:
    name: argocd-server
    port: http
  targetGroupARN: arn:aws:elasticloadbalancing:ap-northeast-2:769413326616:targetgroup/boa-argocd-tg/61badd9d37255277 # aws-render-runtime.sh로 갱신
  targetType: ip
  networking:
    ingress:
      - from:
          - securityGroup:
              groupID: sg-0da61788baa6cdc5c # aws-render-runtime.sh로 갱신
        ports:
          - protocol: TCP
            port: 8080
