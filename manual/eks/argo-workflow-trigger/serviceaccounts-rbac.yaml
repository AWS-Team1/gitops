apiVersion: v1
kind: ServiceAccount
metadata:
  name: boa-deploy-eventsource
  namespace: argo-events
  labels:
    app.kubernetes.io/part-of: boa-s3-deployment
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: boa-deploy-sensor
  namespace: argo-events
  labels:
    app.kubernetes.io/part-of: boa-s3-deployment
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: boa-deploy-workflow
  namespace: argo-events
  labels:
    app.kubernetes.io/part-of: boa-s3-deployment
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: boa-deploy-sensor
  namespace: argo-events
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["create", "get", "list", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtemplates"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: boa-deploy-sensor
  namespace: argo-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: boa-deploy-sensor
subjects:
  - kind: ServiceAccount
    name: boa-deploy-sensor
    namespace: argo-events
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: boa-deploy-workflow-executor
  namespace: argo-events
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflowtaskresults"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: boa-deploy-workflow-executor
  namespace: argo-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: boa-deploy-workflow-executor
subjects:
  - kind: ServiceAccount
    name: boa-deploy-workflow
    namespace: argo-events
---
# Namespaced write access is limited to the existing application namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: boa-manifest-applier
  namespace: bank-of-anthos
rules:
  - apiGroups: [""]
    resources: ["configmaps", "serviceaccounts", "services"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "watch", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  - apiGroups: ["secrets-store.csi.x-k8s.io"]
    resources: ["secretproviderclasses"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: boa-manifest-applier
  namespace: bank-of-anthos
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: boa-manifest-applier
subjects:
  - kind: ServiceAccount
    name: boa-deploy-workflow
    namespace: argo-events
---
# The Namespace document remains in the desired-state snapshot for completeness,
# but bootstrap owns its lifecycle. The Workflow may only confirm that it exists.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: boa-deployment-namespace-reader
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames: ["bank-of-anthos"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: boa-deployment-namespace-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: boa-deployment-namespace-reader
subjects:
  - kind: ServiceAccount
    name: boa-deploy-workflow
    namespace: argo-events
