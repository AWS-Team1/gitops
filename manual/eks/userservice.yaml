---
# Source: bank-of-anthos/templates/userservice/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
spec:
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
    spec:
      serviceAccountName: bank-of-anthos
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: userservice
              topologyKey: kubernetes.io/hostname
      containers:
        - name: userservice
          image: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/boa-userservice:sha-1c2f16df0cb07cd069c41b39d0c44ad309628368
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: VERSION
              value: "1.0"
            - name: PORT
              value: "8080"
            - name: ENABLE_TRACING
              value: "false"
            - name: LOG_LEVEL
              value: "info"
            - name: TOKEN_EXPIRY_SECONDS
              value: "3600"
            - name: PRIV_KEY_PATH
              value: /tmp/.ssh/jwtRS256.key
            - name: PUB_KEY_PATH
              value: /tmp/.ssh/jwtRS256.key.pub
            # DB (stable private DNS / boadb). username·password 는 CSI 로 동기화된 db-secret.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: accounts-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: accounts-db-secret
                  key: password
            - name: ACCOUNTS_DB_URI
              value: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@db.boa.internal:5432/accountsdb"
            - name: VALKEY_HOST
              valueFrom:
                secretKeyRef:
                  name: valkey-secret
                  key: host
            - name: VALKEY_PORT
              value: "6379"
            - name: VALKEY_USERNAME
              valueFrom:
                secretKeyRef:
                  name: valkey-secret
                  key: username
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-secret
                  key: password
            - name: VALKEY_TLS
              value: "true"
            - name: VALKEY_CLUSTER_MODE
              value: "true"
          volumeMounts:
            - name: secrets-store
              mountPath: /tmp/.ssh
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: bank-of-anthos-accounts-secrets
---
# Source: bank-of-anthos/templates/userservice/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: userservice
spec:
  selector:
    app: userservice
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP
---
# Source: bank-of-anthos/templates/userservice/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: userservice-networkpolicy
spec:
  podSelector:
    matchLabels:
      app: userservice
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - port: 8080
  egress:
    # RDS boa-postgres DB subnet A/C
    - to:
        - ipBlock:
            cidr: 192.168.16.0/24
        - ipBlock:
            cidr: 192.168.17.0/24
      ports:
        - port: 5432
    - ports:                      # default-deny 때문에 DNS egress 필수
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 192.168.24.0/24
        - ipBlock:
            cidr: 192.168.25.0/24
      ports:
        - port: 6379
          protocol: TCP
        - port: 6380
          protocol: TCP