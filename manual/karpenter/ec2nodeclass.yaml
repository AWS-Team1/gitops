apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: boa-eks-node-role
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: boa-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: boa-eks
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 30Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    Name: boa-eks-karpenter-node
    Project: boa
    ManagedBy: karpenter
