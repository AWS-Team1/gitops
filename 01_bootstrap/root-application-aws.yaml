# Root ("app of apps") Application.
#
# 클러스터에 단 한 번 kubectl apply 되는 유일한 매니페스트다.
# 이후의 모든 것(AppProject, platform controller, workload ApplicationSet)은
# 이 Application 이 Git 의 argocd/ 경로를 동기화하면서 만들어진다.
#
# repoURL / targetRevision 은 scripts/bootstrap-eks.sh 가 렌더링한다.
# GENERATED FIELDS - do not edit repoURL/targetRevision by hand.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bank-app-root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://github.com/AWS-Team1/gitops.git
    targetRevision: dev
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
