apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: argocd-server
  namespace: argocd
spec:
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 8080
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: argocd-gcp
  namespace: argocd
spec:
  domains:
    - argocd-gcp.bespinglobal.site
---
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: argocd-gcp
  namespace: argocd
spec:
  redirectToHttps:
    enabled: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-gcp
  namespace: argocd
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: boa-gke-argocd-ip
    networking.gke.io/managed-certificates: argocd-gcp
    networking.gke.io/v1beta1.FrontendConfig: argocd-gcp
spec:
  rules:
    - host: argocd-gcp.bespinglobal.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  name: http
