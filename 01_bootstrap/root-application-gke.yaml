# Root ("app of apps") Application.
#
# 클러스터에 단 한 번 kubectl apply 되는 유일한 매니페스트다.
# 이후의 모든 것(AppProject, platform controller, workload ApplicationSet)은
# 이 Application 이 Git 의 argocd/ 경로를 동기화하면서 만들어진다.
#
# HARD-CODED: repoURL/targetRevision은 재사용할 조직·저장소·브랜치에 맞게 바꾼다.
# 이 테스트 브랜치가 GKE의 desired state다. dev 병합 전에는 targetRevision을
# 바꾸지 않아 CI의 dev write-back과 CD 검증이 섞이지 않게 한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boa-gke-root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://github.com/AWS-Team1/gitops.git
    targetRevision: dev-0922
    path: 03_manifests/overlays/gke/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
