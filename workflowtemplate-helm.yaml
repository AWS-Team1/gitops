apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: aws-dev-helm-deploy
  namespace: argo
spec:
  serviceAccountName: workflow-deployer
  entrypoint: deploy
  synchronization:
    mutexes:
      - name: aws-dev-deploy
  arguments:
    parameters:
      - name: gitops-sha
      - name: chart-version
      - name: chart-digest
  templates:
    - name: deploy
      retryStrategy:
        limit: "1"
        retryPolicy: OnFailure
      container:
        image: 769413326616.dkr.ecr.ap-northeast-2.amazonaws.com/boa-argo-deployer@sha256:f54762c4d5c1304bdc38870a7a50c4b8155b6c898ad576d234ff476cede01575
        command: [sh, -c]
        args:
          - |
            set -eu
            registry="769413326616.dkr.ecr.ap-northeast-2.amazonaws.com"
            repository="boa-platform-chart"
            version="{{workflow.parameters.chart-version}}"
            expected_digest="{{workflow.parameters.chart-digest}}"
            gitops_sha="{{workflow.parameters.gitops-sha}}"

            printf '%s' "$version" | grep -Eq '^0\.1\.0-dev\.[0-9]+\.[0-9]+$'
            printf '%s' "$expected_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            printf '%s' "$gitops_sha" | grep -Eq '^[0-9a-f]{40}$'

            actual_digest="$(aws ecr describe-images \
              --region ap-northeast-2 \
              --repository-name "$repository" \
              --image-ids "imageTag=$version" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"
            test "$actual_digest" = "$expected_digest"

            aws ecr get-login-password --region ap-northeast-2 | \
              helm registry login --username AWS \
              --password-stdin "$registry"

            helm pull "oci://${registry}/${repository}" \
              --version "$version" --destination /work

            chart_file="$(find /work -maxdepth 1 -type f -name '*.tgz' | head -n 1)"
            test -n "$chart_file"

            helm upgrade --install boa-workflows-poc "$chart_file" \
              --namespace bank-of-anthos \
              --atomic --wait --timeout 10m

            echo "deployed gitops=${gitops_sha} chart=${version} digest=${actual_digest}"
        volumeMounts:
          - name: work
            mountPath: /work
  volumes:
    - name: work
      emptyDir: {}
