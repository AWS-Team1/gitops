# AppProject: 어떤 Application 이 어떤 저장소에서 어디로 배포할 수 있는지 제한한다.
# sourceRepos / repoURL 은 scripts/bootstrap-eks.sh 가 렌더링한다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: bank-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: Bank of Anthos workload
  sourceRepos:
    - https://github.com/AWS-Team1/gitops.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: bank-of-anthos
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
---
# platform controller 용 프로젝트. 공개 Helm 차트만 허용한다.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  description: Cluster add-ons managed by GitOps
  sourceRepos:
    - https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
    - https://kubernetes-sigs.github.io/metrics-server/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: kube-system
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
