# Secrets Store CSI Driver (upstream).
#
# 왜 GitOps 인가:
#   infra 의 EKS addon 은 AWS *provider*(aws-secrets-store-csi-driver-provider)만
#   설치한다. SecretProviderClass CRD 와 CSI 드라이버 자체는 별도로 설치해야 한다.
#   이 컴포넌트는 AWS IAM 과 무관한 순수 Kubernetes 컨트롤러이므로 GitOps 가 소유한다.
#
# sync-wave -5: workload ApplicationSet(wave 0) 보다 먼저 동기화되어
#   SecretProviderClass CRD 가 없어서 workload sync 가 실패하는 상황을 막는다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-store-csi-driver
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: platform
  source:
    repoURL: https://kubernetes-sigs.github.io/secrets-store-csi-driver/charts
    chart: secrets-store-csi-driver
    targetRevision: 1.6.1
    helm:
      releaseName: csi-secrets-store
      values: |
        syncSecret:
          enabled: true
        enableSecretRotation: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
