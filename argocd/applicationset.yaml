# workload ApplicationSet.
# repoURL / targetRevision 은 scripts/bootstrap-eks.sh 가 렌더링한다.
# GENERATED FIELDS - do not edit repoURL/targetRevision by hand.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bank-app-aws
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - list:
        elements:
          - environment: dev
            namespace: bank-of-anthos
            server: https://kubernetes.default.svc
  template:
    metadata:
      name: 'bank-app-aws-{{.environment}}'
      labels:
        app.kubernetes.io/part-of: bank-app
        platform: aws
        environment: '{{.environment}}'
    spec:
      project: bank-app
      source:
        repoURL: https://github.com/AWS-Team1/gitops.git
        targetRevision: dev
        path: 'k8s/overlays/{{.environment}}/aws'
      destination:
        server: '{{.server}}'
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          enabled: true
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
